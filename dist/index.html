@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--table:#dfe7ea;--table2:#ecf1f3;--pillbg:#ecf1f3;--lbar:rgba(34,49,62,.16);--lbarh:rgba(34,49,62,.3);--gold:#d1952a;--gold-hov:#dfa63c;--gold-rgb:209,149,42;--totalbg:#f3ecd6;--totalring:rgba(0,0,0,.25);--line:#b6c4cc;--text:#1f2a33;--muted:#58697a;--badge-bg:#c9972e;--badge-fg:#fff;--gold-t:var(--gold);--ivt:#22313e;--fieldA:rgba(255,255,255,.85);--field:#fff;--vig1:#f1f5f7;--vig2:#cbd7dd;--hov:#d3dfe5;--hov2:rgba(0,0,0,.06);--pos:#1f7a3d;--neg:#b3352b;--cn:#2f8f5b;--shade:rgba(0,0,0,.07)}}
:root[data-theme="light"]{--table:#dfe7ea;--table2:#ecf1f3;--pillbg:#ecf1f3;--lbar:rgba(34,49,62,.16);--lbarh:rgba(34,49,62,.3);--gold:#d1952a;--gold-hov:#dfa63c;--gold-rgb:209,149,42;--totalbg:#f3ecd6;--totalring:rgba(0,0,0,.25);--line:#b6c4cc;--text:#1f2a33;--muted:#58697a;--badge-bg:#c9972e;--badge-fg:#fff;--gold-t:var(--gold);--ivt:#22313e;--fieldA:rgba(255,255,255,.85);--field:#fff;--vig1:#f1f5f7;--vig2:#cbd7dd;--hov:#d3dfe5;--hov2:rgba(0,0,0,.06);--pos:#1f7a3d;--neg:#b3352b;--cn:#2f8f5b;--shade:rgba(0,0,0,.07)}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--pg);font:400 calc(15px*var(--fs,1))/1.5 var(--ui);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:900px;margin:0 auto;padding:8px 16px 24px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font:900 calc(30px*var(--fs,1))/1 var(--face);margin:0;letter-spacing:.08em;color:var(--h)}
.brand{display:flex;flex-direction:column;gap:3px}
.sub{font-size:calc(12px*var(--fs,1));color:var(--pgm);letter-spacing:.02em}
.sub:empty{display:none}
.meta{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--pgm);font-size:calc(13px*var(--fs,1))}
.tbar{display:flex;justify-content:center;margin:-2px 0}
#cheatBar{display:none}
@media (min-width:521px){.table{position:relative}.tbar{position:absolute;top:10px;right:12px;margin:0;z-index:2}}
.tbar .pill{display:flex;align-items:center;gap:8px;background:var(--pillbg,rgba(0,0,0,.28));color:var(--muted);padding:5px 14px 5px 10px;border-radius:99px;font-size:calc(14px*var(--fs,1))}
.tbar .pill svg{width:56px;height:38px;display:block}
.tbar .pill b{color:var(--gold-t);font-size:calc(22px*var(--fs,1));line-height:1;font-variant-numeric:tabular-nums}
.meta .pill{background:var(--table);color:var(--text);padding:4px 10px;border-radius:99px}
button.btn{font:500 calc(14px*var(--fs,1)) var(--ui);color:var(--text);background:var(--table2);border:1px solid var(--line);padding:7px 14px;border-radius:8px;cursor:pointer}
button.btn:hover{background:var(--hov)}
button.btn:focus-visible,.tile.clk:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.btn,.tile.clk{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button.btn.sm{padding:5px 11px;font-size:calc(13px*var(--fs,1))}
button.btn:disabled{opacity:.4;cursor:default}
button.btn.primary{background:var(--gold);color:#2a1f08;border-color:var(--gold);font-weight:700}
button.btn.primary:hover{background:var(--gold-hov)}
button.btn.ghost{background:transparent;color:var(--pg);border-color:var(--pgm)}

.table{color:var(--text);background:var(--table);border-radius:14px;padding:8px;display:grid;gap:6px}
.seat{background:var(--table2);border-radius:10px;padding:6px 10px;border:2px solid transparent}
.seat.active{border-color:var(--gold)}
.seat-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:calc(13px*var(--fs,1));color:var(--muted)}
.seat-head b{color:var(--text);font-size:calc(14px*var(--fs,1))}
.ruby-x{}
rt{font-size:.55em;font-weight:400;color:var(--muted);letter-spacing:0}
.dealer{display:inline-block;margin-left:10px;background:#f3ecd6;color:#2a1f08;border-radius:99px;padding:1px 9px;font-weight:700;font-size:calc(12px*var(--fs,1));line-height:1.5;letter-spacing:.04em;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.seat-head .total{color:var(--muted);font-size:calc(12px*var(--fs,1));background:var(--totalbg,rgba(0,0,0,.2));padding:2px 8px;border-radius:99px;box-shadow:0 0 0 1px var(--totalring,transparent)}
.seat-head .total b{color:var(--text);font-size:calc(14px*var(--fs,1));margin-left:.6em}
.seat-head .dealer,.seat-head .total{display:inline-flex;align-items:center;box-sizing:border-box;height:calc(24px*var(--fs,1));padding-top:0;padding-bottom:0;line-height:1;vertical-align:middle}
.seat-head .score{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:calc(12px*var(--fs,1));white-space:nowrap;display:flex;align-items:baseline;gap:5px}
.seat-head .score b{font-size:calc(22px*var(--fs,1));line-height:1;color:var(--text);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;min-height:20px}
.melds{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0}
.meld{display:flex;gap:1px;padding:2px;border-radius:5px;background:rgba(0,0,0,.18)}
.pool{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start}
.zone{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-top:6px;min-height:3.4em}
.zone .pool{flex:1 1 auto;min-width:0}
.zone .melds{flex:none;max-width:48%;justify-content:flex-end;margin:0;padding-left:10px;border-left:1px solid var(--line)}
.zone .melds:empty{display:none}
.backs{display:flex;gap:1px;flex-wrap:wrap}

/* tiles: sized by font-size so everything scales together */
.tile{--u:14px;font-size:var(--u);width:3.3em;height:4em;position:relative;flex:none;border-radius:.45em;
  background:linear-gradient(170deg,#fffdf2,var(--ivory) 55%,#eadfbf);color:#222;border:.12em solid #2b2a28;
  box-shadow:0 .26em 0 var(--jade-d),0 .26em 0 .12em #2b2a28;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12em;
  font-family:var(--ui);font-weight:900;line-height:1;margin-bottom:.45em;padding:0}
.tile.sm{--u:9px}
.tile.md{--u:11px}
.tile.xs{--u:8.5px;margin-bottom:.4em}
.tile i{font-style:normal;display:block}
.tile .n{font-size:1.9em;font-weight:700;-webkit-text-stroke:.03em currentColor}
.tile .ic{display:block;flex:none}
.tile .ic.c{width:1.05em;height:1.05em;border-radius:50%;border:.24em solid currentColor;position:relative}
.tile .ic.c::after{content:"";position:absolute;inset:.17em;border-radius:50%;background:currentColor}
.tile .ic.k{width:.5em;height:1.25em;border-radius:.22em;background:currentColor;position:relative}
.tile .ic.k::after{content:"";position:absolute;left:-.06em;right:-.06em;top:50%;height:.14em;margin-top:-.07em;background:var(--ivory);opacity:.9}
.tile .ic.w{font:700 1.35em/1 var(--ui)}
.tile .h{font:700 2.3em/1 var(--ui)}
.tile .v{display:none} /* 點值 = 牌面數字，不再顯示金色點值徽章（程式碼保留） */
.tile .v{position:absolute;top:-.35em;right:-.4em;min-width:1.4em;height:1.4em;padding:0 .2em;border-radius:99px;background:var(--badge-bg);
  font:700 .7em/1.4em var(--ui);text-align:center;color:var(--badge-fg);margin:0;-webkit-text-stroke:0}
.tile.p{color:var(--blue)} .tile.s{color:var(--green)} .tile.m{color:var(--red)}
.tile.z1{color:var(--red)} .tile.z2{color:var(--green)} .tile.z3{color:var(--blue)}
.tile.z3 .h{position:relative;width:2.3em;height:3.1em;font-size:1em;border:.17em solid currentColor;border-radius:.4em;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(36,92,156,.07))}
.tile.z3 .h::before{content:"";position:absolute;inset:.22em;border:.07em solid currentColor;border-radius:.25em}
.tile.z3 .h::after{content:"";position:absolute;inset:.22em;border-radius:.25em;
  background:
   radial-gradient(circle at 0 0,currentColor .2em,transparent .21em) top left/.5em .5em no-repeat,
   radial-gradient(circle at 100% 0,currentColor .2em,transparent .21em) top right/.5em .5em no-repeat,
   radial-gradient(circle at 0 100%,currentColor .2em,transparent .21em) bottom left/.5em .5em no-repeat,
   radial-gradient(circle at 100% 100%,currentColor .2em,transparent .21em) bottom right/.5em .5em no-repeat}
.tile{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile.dragging{opacity:.25}

.tile.clk{cursor:pointer;transition:transform .12s}
.tile.clk:hover{transform:translateY(-.3em)}
.tile.sel.clk:hover{transform:translateY(-.8em)}
.tile.clk::before{content:"";position:absolute;left:-.12em;right:-.12em;top:100%;height:.6em}
.tile.sel{transform:translateY(-.8em);outline:2px solid var(--gold);outline-offset:1px}

#opps{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"across across" "left right";gap:6px;align-items:start}

'use strict';
/* ===== 幺九龍 engine (no DOM) ===== */
const RULES = {
  ALLOW_789_ANKAN: false,      // 7-9 可否暗槓（字面解讀：不可）
  PAIR_HONOR_BREAKS_PINGHU: true, // 平胡的將不可以是中發白
  RON_MULT: 2,                 // 出銃者付 2x，自摸每家付 1x
};
const NUM = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
const SUITN = { p: '筒', s: '索', m: '萬' };
const HON = { 1: '中', 2: '發', 3: '白' };
const ORDER = [];
for (const s of ['p', 's', 'm']) for (let n = 1; n <= 9; n++) ORDER.push(s + n);
ORDER.push('z1', 'z2', 'z3');
const ORD = {}; ORDER.forEach((k, i) => ORD[k] = i);

const tname = t => t.s === 'z' ? HON[t.n] : NUM[t.n] + SUITN[t.s];
const val = t => t.s === 'z' ? 0 : 10 - t.n;
const sortTiles = a => a.slice().sort((x, y) => ORD[x.k] - ORD[y.k] || x.id - y.id);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeDeck() {
  let id = 0; const d = [];
  for (const s of ['p', 's', 'm']) for (let n = 1; n <= 9; n++) for (let c = 0; c < n; c++) d.push({ id: id++, s, n, k: s + n });

function simGame() {
  const g = newGame(0);
  let seat = 0, rep = false, needDraw = true, guard = 0;
  while (guard++ < 2000) {
    if (needDraw) { if (!drawTile(g, seat, rep)) return { draw: true, g }; }
    const drew = needDraw; needDraw = true; rep = false;
    const opts = selfOptions(g, seat, !drew);
    const act = botSelf(g, seat, opts);
    if (act.win) return { res: winResult(g, seat, true, null, opts.win), g };
    if (act.kong) { applyKong(g, seat, act.kong); rep = true; continue; }
    const t = discardTile(g, seat, act.discard);
    const c = botClaims(g, seat, t, []);
    if (c) {
      if (c.kind === 'ron') { const ev = c.ev; return { res: winResult(g, c.seat, false, seat, ev), g }; }
      applyClaim(g, c.seat, c.kind, c.opt, t, seat);
      seat = c.seat; if (c.kind === 'kong') { rep = true; } else needDraw = false;
      continue;
    }
    seat = (seat + 1) % 4;
  }
  return { draw: true, g };
}

    <li>點值 = 牌面數字（一＝1 … 九＝9），紅中、發財、白板 0 分。數字越大的牌越少。</li>
    <li>小字牌＝1–3，大字牌＝7–9。</li>
  </ul>
  <h3>吃碰槓</h3>
  <ul>
    <li>小字牌（1–3）一律不能吃碰槓，暗槓也不可，也不可進入鳴牌區。</li>
    <li>彩碰：7–9 同數字、不同花色（或自己手上兩張湊成），被要的那一張不計分，以變淡標示。</li>
    <li>彩刻：7–9 同數字、不同花色的三張牌，不用碰也可以在手牌裡自己湊成刻子（暗刻），和一般刻子一樣計算（對對胡、三暗刻、四暗刻都可以用）。全部同花色的仍是一般刻子。</li>
    <li>彩眼：7–9 同數字、不同花色的兩張牌可以當眼（例如 九筒＋九索）。彩眼不可鳴，只可榮胡（或自摸）湊成。它不算三元眼；幺九龍的眼仍須是同一種牌。</li>
    <li>沒有彩吃：吃只可以吃同花色順子，只可吃上家；順子內不可含 1–3（有 4、5 也不可吃 3，有 2、3 也不可吃 4），所以只可吃 456、567、678、789。</li>
    <li>只有 4–6 和紅中、發財、白板可以槓，1–3 與 7–9 都不能槓（暗槓也不可）。沒有混槓，槓只可同花色同數字。</li>
    <li>三元大槓：暗槓或加槓紅中、發財、白板後可再補第五張（點「槓」），多 0.5 番。</li>
    <li>多人同時碰（例如 4、5 或紅中、發財、白板）：棄牌者的下家優先，再對家，再上家。胡牌最優先，吃最後。</li>
    <li>沒有搶槓。槓之後從牌山尾補牌。</li>
  </ul>
  ${EG('牌面示例：吃碰槓、彩碰、三元大槓', [X('吃','s2 s3 s4|p4 p5 p6|m1 m2 m3'),X('碰／槓','p5 p5 p5|s6 s6 s6 s6|z1 z1 z1'),X('彩碰（被要的牌變淡）','p1 s1 m1*|s2 s2 p2*|m3 p3* s3'),X('彩刻（手牌內暗刻）','p1 s1 m1|p2 s2 m2|p3 s3 m3'),X('彩眼','p1 s1|p2 m2|s3 m3'),X('三元大槓（5 張）','z1 z1 z1 z1 z1|z2 z2 z2 z2 z2|z3 z3 z3 z3 z3'),X('1–3 不能吃碰槓','p7 p8 p9|s8 s8 s8|m9 m9 m9')])}
  <h3>番種（疊加，6 番封頂）</h3>
  <ul>
    <li><b>1 番</b>
      <ul>
        <li><b>三元刻</b>：紅中、發財、白板任一組刻子，明碰或暗刻都算，每組可疊加。</li>
        <li><b>平胡</b>：全順子、無三元。</li>
        <li><b>對對胡</b>：4 刻 + 眼，彩碰可。</li>
        <li><b>彩眼混一色</b>：混一色或清一色，眼是彩眼，彩眼中至少有一張是主色；第一副三元刻不另計。</li>
        <li><b>彩碰混一色</b>：混一色或清一色中其中一刻為彩碰，彩碰中至少有一張是主色（例如 8筒8筒8萬 在筒子手牌）；多於一刻彩碰不可；第一副三元刻不另計。</li>
      </ul>
    </li>
    <li><b>2 番</b>
      <ul>
        <li><b>混一色</b>：一門 + 三元。不可彩碰、彩刻、彩眼；不重複算斷一門；第一副三元刻不另計。</li>
        <li><b>不求人</b>：無鳴牌、自摸。門清加自摸，不重複算門清或自摸。</li>
        <li><b>斷小字</b>：整副手牌沒有 1–3。</li>
        <li><b>三暗刻</b></li>
        <li><b>七對子</b>：7 對、全暗。四張相同算兩對（如 8888）；可疊混一色、清一色；不可彩眼；不重複算門清。</li>
      </ul>
    </li>
    <li><b>3 番</b>
      <ul>
        <li><b>小三元</b>：兩組三元刻 + 第三種三元作眼。不另計三元刻，手牌點值立刻 +30。</li>
        <li><b>全小字</b>：整副手牌只有 1–3。不重複算門清。</li>
        <li><b>幺九順</b>：同花色 123＋456＋789；其餘一組可順可碰、可不同花色。</li>
      </ul>
    </li>
    <li><b>4 番</b>
      <ul>
        <li><b>清一色</b>：只有一門、無三元。不可彩碰、彩刻、彩眼；不重複算斷一門無三元。</li>
        <li><b>四暗刻</b></li>
        <li><b>大三元</b>：三元全刻。不另計三元刻，手牌點值立刻 +60。</li>
        <li><b>門清幺九順</b>：同幺九順但無鳴牌，手牌點值立刻 +30；不重複算門清。</li>
      </ul>
    </li>
    <li><b>6 番（封頂）</b>
      <ul>
        <li><b>幺九龍</b>：同花色 123＋456＋789＋紅中、發財、白板各一＋同花色數字或三元的眼，手牌點值立刻 +30。</li>
        <li><b>門清幺九龍</b>：同上但無鳴牌，手牌點值立刻 +90。</li>
        <li><b>槓三元</b>：紅中、發財、白板全槓，手牌點值立刻 +90。</li>
        <li><b>天胡</b>：莊家起手即胡。</li>
        <li><b>地胡</b>：閒家胡莊家打出的第一隻牌。</li>
        <li><b>人胡</b>：閒家第一次摸牌自摸，之前無人吃碰槓。</li>
        <li>天胡、地胡、人胡只要牌型完成即可，不需另有番種。</li>
      </ul>
    </li>
  </ul>
  ${EGH('牌面示例：番種', 'zh', '換一組')}
  <h3>半番（碎番，每項 +0.5 番）</h3>
  <ul>
    <li>必須已有至少 1 番才能追加；只有碎番、沒有全番不能胡，兩個半番不能起胡。</li>
    <li><b>槓</b>：每次槓。</li>
    <li><b>三元大補槓</b></li>
    <li><b>門清</b>：無鳴牌。不求人、全小字、七對子、門清幺九順不再加。</li>
    <li><b>自摸</b>：只給有鳴牌的手牌；不求人已包含自摸。</li>
    <li><b>槓上自摸</b>：槓後補牌自摸。與自摸及槓重疊，合共追加 1.5 番。</li>
    <li><b>斷一門無三元</b>：筒索萬缺一門且沒有紅中、發財、白板；混一色、清一色不重複算。</li>
    <li><b>胡大字</b>：胡的那張牌是 7–9。</li>
  </ul>
  <h3>暗刻</h3>
  <ul>
    <li>暗槓算暗刻。</li>
    <li>榮胡時，靠胡牌完成的刻子算明刻。</li>
    <li>但如果胡牌可以放進眼或順子，該刻子仍算暗刻（榮胡進眼不毀暗刻）。</li>
  </ul>
  <h3>計分</h3>
  <ul>
    <li>總番數取整數部分，所以 1+0.5+0.5＝2 番，1+0.5＝1.5 番則算 1 番。</li>
    <li>倍數 = 番數（1 番 ×1 … 6 番 ×6）。</li>
    <li>得分 = 全手牌點值總和（含已鳴的牌，扣除彩碰被要的那張，加上各牌型的立刻加分）× 倍數。</li>
    <li>付款（暫定）：自摸，其餘三家各付一份；出銃，出銃者付兩份。</li>
  </ul>
  <h3>操作</h3>
  <ul><li>點一下牌＝選取並顯示資訊；手機上再點一次是取消選取。要打出時，按手牌下面的「打出」按鈕，只會打出目前選取的那張。滑鼠用戶也可以對已選取的牌再點一次來打出。</li>
    <li>調整手牌順序：電腦用滑鼠拖曳；手機長按牌再拖曳。也可以先選一張牌，按 ◀ ▶ 移動；按「整理」回到自動排序。</li>
    <li>滑鼠移到牌上（手機點一下牌）會顯示這種牌共幾張、已見幾張、還剩幾張（已見＝你的手牌＋所有棄牌＋所有鳴牌）。</li>
    <li>電腦的策略很簡單（不防守，會隨機吃碰），只適合測規則。</li></ul>`,
en: `  <h2>Kowloon Dragons (幺九龍): rules as implemented</h2>
  <p class="rintro">Kowloon Dragons is a brand-new game from the mahjong family, and you're invited to try it! Its biggest difference from traditional mahjong is that every tile carries a point value and the number of copies varies, so every draw is a fresh opportunity. On top of the traditional scoring patterns, it adds brand-new ones: lots of variety, a light and quick pace, and a good fit for anyone, whether or not you've played traditional mahjong.</p>
  <p>Kowloon Dragons is a tile game from the mahjong family. It needs its own 150-tile set, not a regular mahjong set. On this page you play against 3 computer players. A hand starts with the dealer; there are no winds or dealer streaks. The wall is reshuffled every hand and scores carry over.</p>
  <h3>Goal</h3>
  <ul>
    <li>Hand of 13 tiles; you win on the 14th with <b>4 sets + 1 pair</b> (a set is a chow or a triplet; a kong counts as one set).</li>
    <li>You need at least <b>1 full fan</b> to win. Minor fans (½) alone don't count.</li>
  </ul>
  <h3>Tiles and points</h3>
  <ul>
    <li>Circles (筒), Bamboo (索), Characters (萬): 45 tiles each, with <b>10 − n copies of number n</b> (nine 1s … one 9).</li>
    <li>Dragons: Red (中), Green (發) and White (白), 5 copies each. 150 tiles in total.</li>
    <li>Point value = the number on the tile: 1 = 1 pt … 9 = 9 pts. Dragons = 0. The higher the number, the rarer the tile.</li>
    <li>Small tiles = 1–3. Middle tiles = 4–6. Big tiles = 7–9.</li>
  </ul>
  <h3>Calling a discard</h3>
  <ul>
    <li><b>Chow (吃)</b>
      <ul>
        <li>Same suit only, and only from your upstream player (the one who plays right before you, on your left).</li>
        <li>The chow can't contain a 1–3. Holding 4-5 you can't chow a 3; holding 2-3 you can't chow a 4.</li>
        <li>So only <b>456, 567, 678 and 789</b> can be claimed. A 123 chow is fine inside your closed hand.</li>
        <li>No mixed chow.</li>
      </ul>
    </li>
    <li><b>Pung (碰)</b>
      <ul>
        <li>Allowed for 4–9 and dragons. Small tiles (1–3) can never be punged.</li>
        <li>If several players can pung the same discard, priority is: the discarder's downstream player (next to play), then across, then upstream.</li>
      </ul>
    </li>
    <li><b>Kong (槓)</b>
      <ul>
        <li>Allowed for 4–6 and dragons, same suit and number only. No mixed kong.</li>
        <li>Small tiles (1–3) and big tiles (7–9) can't be konged or concealed-konged.</li>
        <li>After a kong you draw a replacement tile from the end of the wall.</li>
      </ul>
    </li>
    <li><b>Win (胡)</b> beats pung and kong, and a chow comes last. No robbing the kong.</li>
  </ul>
  ${EG('Tile examples: chow, pung, kong', [X('Chow','s2 s3 s4|p4 p5 p6|m1 m2 m3'),X('Pung / kong','p5 p5 p5|s6 s6 s6 s6|z1 z1 z1'),X('Never claimable (1–3)','p7 p8 p9|s8 s8 s8|m9 m9 m9')])}
  <h3>Special actions</h3>
  <ul>
    <li><b>Mixed pung (彩碰)</b>
      <ul>
        <li>Numbers 7–9 only: the same number in three different suits.</li>
        <li>Example: hold 9筒 + 9索 and claim a 9萬, or hold two 8索 and claim an 8筒.</li>
        <li>The claimed tile scores 0 (shown faded); the tiles from your hand still score.</li>
      </ul>
    </li>
    <li><b>Mixed triplet in hand (彩刻)</b>
      <ul>
        <li>The same three-suit set of a 7–9 number can also be formed inside your closed hand, with no call.</li>
        <li>It counts as a concealed triplet for All Triplets, Three Concealed Triplets and Four Concealed Triplets.</li>
        <li>On a discard win, a mixed triplet completed by the winning tile counts as open, unless that tile could sit in the pair or a chow.</li>
      </ul>
    </li>
    <li><b>Mixed pair (彩眼)</b>
      <ul>
        <li>Two tiles of the same number 7–9 in different suits can serve as the pair, for example 9筒 + 9索. It can never be called, only completed by winning (on a discard or by self-draw).</li>
        <li>It is not a dragon pair, and the Kowloon Dragon pair must still be two identical tiles.</li>
      </ul>
    </li>
    <li><b>Grand dragon kong (三元大槓)</b>
      <ul>
        <li>After a concealed kong or added kong of a dragon, you can add the 5th copy (press Kong).</li>
        <li>Worth an extra ½ fan. Each dragon has 5 copies; this must be self-drawn.</li>
      </ul>
    </li>
  </ul>
  ${EG('Tile examples: special actions', [X('Mixed pung (claimed tile faded)','p1 s1 m1*|s2 s2 p2*|m3 p3* s3'),X('Mixed triplet in hand (concealed)','p1 s1 m1|p2 s2 m2|p3 s3 m3'),X('Mixed pair','p1 s1|p2 m2|s3 m3'),X('Grand dragon kong (5 copies)','z1 z1 z1 z1 z1|z2 z2 z2 z2 z2|z3 z3 z3 z3 z3')])}
  <h3>Winning hands (fans stack, capped at 6)</h3>
  <ul>
    <li><b>1 fan</b>
      <ul>
        <li><b>Dragon triplet (三元刻)</b>: each triplet of Red, Green or White Dragon counts, whether it is a revealed pung or a concealed triplet. They stack.</li>
        <li><b>All Chows (平胡)</b>: all chows, no dragons.</li>
        <li><b>All Triplets (對對胡)</b>: 4 triplets + pair. Mixed pungs are allowed.</li>
        <li><b>Mixed-Pair Half Flush (彩眼混一色)</b>: a Half Flush or Full Flush whose pair is a mixed pair; at least one tile of the mixed pair must be the main suit. The first dragon triplet isn’t counted separately.</li>
        <li><b>Mixed-Pung Half Flush (彩碰混一色)</b>: a Half Flush or Full Flush where one of the triplets is a mixed pung; at least one tile of the mixed pung must be the main suit (e.g. 8-Circle 8-Circle 8-Character in a Circles hand). More than one mixed pung doesn’t count. The first dragon triplet isn’t counted separately.</li>
      </ul>
    </li>
    <li><b>2 fan</b>
      <ul>
        <li><b>Half Flush (混一色)</b>: one suit plus dragons. No mixed pung, mixed triplet or mixed pair. Doesn’t also get Missing suit. The first dragon triplet isn’t counted separately.</li>
        <li><b>Concealed Self-Draw (不求人)</b>: no calls and you win by drawing. Replaces Concealed and Self-draw.</li>
        <li><b>No Small (斷小字)</b>: no 1–3 anywhere in the hand.</li>
        <li><b>Three Concealed Triplets (三暗刻)</b></li>
        <li><b>Seven Pairs (七對子)</b>: seven pairs, all concealed. Four of a kind counts as two pairs (8888). No mixed pair. Can stack with Half Flush and Full Flush. No Concealed bonus on top.</li>
      </ul>
    </li>
    <li><b>3 fan</b>
      <ul>
        <li><b>Small Dragons (小三元)</b>: two dragon triplets + a pair of the third. Replaces the dragon triplet fan; hand points +30.</li>
        <li><b>All Small (全小字)</b>: only 1–3 number tiles in the whole hand. No Concealed bonus.</li>
        <li><b>Kowloon Straight (幺九順)</b>: 123 + 456 + 789 in one suit. The remaining set is a chow or a triplet in any suit; the pair is anything.</li>
      </ul>
    </li>
    <li><b>4 fan</b>
      <ul>
        <li><b>Full Flush (清一色)</b>: one suit only, no dragons. No mixed pung, mixed triplet or mixed pair. Doesn’t also get Missing suit, no dragons.</li>
        <li><b>Four Concealed Triplets (四暗刻)</b></li>
        <li><b>Great Dragons (大三元)</b>: triplets of all three dragons. Replaces the dragon triplet fan; hand points +60.</li>
        <li><b>Concealed Kowloon Straight (門清幺九順)</b>: a Kowloon Straight with no open melds. Hand points +30. No Concealed bonus on top.</li>
      </ul>
    </li>
    <li><b>6 fan (cap)</b>
      <ul>
        <li><b>Kowloon Dragon (幺九龍)</b>: 123 + 456 + 789 in one suit + one each of Red, Green and White Dragon + a pair of a same-suit number or a dragon. Hand points +30.</li>
        <li><b>Concealed Kowloon Dragon (門清幺九龍)</b>: the same, with no open melds. Hand points +90.</li>
        <li><b>Dragon Kongs (槓三元)</b>: kongs of all three dragons. Hand points +90.</li>
        <li><b>Heavenly Win (天胡)</b>: the dealer wins on the starting hand.</li>
        <li><b>Earthly Win (地胡)</b>: a non-dealer wins on the dealer’s very first discard.</li>
        <li><b>Human Win (人胡)</b>: a non-dealer wins by self-draw on their first draw, with nobody having called a chow, pung or kong before it.</li>
        <li>Heavenly, Earthly and Human Wins only need a complete hand; no other fan is required.</li>
      </ul>
    </li>
  </ul>
  ${EGH('Tile examples: winning hands', 'en', 'Shuffle')}
  <h3>Minor fans (碎番, ½ fan each)</h3>
  <ul>
    <li>Only added once you already have at least 1 full fan; two ½ fans alone can’t win.</li>
    <li><b>Kong (槓)</b>: each kong.</li>
    <li><b>Grand dragon kong (三元大補槓)</b></li>
    <li><b>Concealed (門清)</b>: no calls. Not given with Concealed Self-Draw, All Small, Seven Pairs or Concealed Kowloon Straight.</li>
    <li><b>Self-draw (自摸)</b>: open hands only. Concealed Self-Draw already includes it.</li>
    <li><b>Kong self-draw (槓上自摸)</b>: you win by self-draw on the replacement tile drawn after a kong. It stacks with Self-draw and Kong, so a win like that adds 1½ fan in total.</li>
    <li><b>Missing suit, no dragons (斷一門無三元)</b>: one of the three suits is absent and the hand has no dragons. Half Flush and Full Flush don’t get it.</li>
    <li><b>Win on a big tile (胡大字)</b>: the winning tile is a 7–9.</li>
  </ul>
  <h3>Concealed triplets</h3>
  <ul>
    <li>A concealed kong counts as concealed.</li>
    <li>On a discard win, a triplet completed by the winning tile counts as open.</li>
    <li>But if the winning tile could instead sit in the pair or in a chow, the triplet stays concealed.</li>
  </ul>
  <h3>Scoring</h3>
  <ul>
    <li>Total fan is rounded down, so 1 + ½ + ½ = 2 fan, while 1 + ½ = 1.5 counts as 1 fan.</li>
    <li>Multiplier = fan (1 fan ×1 … 6 fan ×6).</li>
    <li>Score = total tile points of the whole hand (melds included, minus the claimed tile of a mixed pung, plus any instant bonus of the hand) × multiplier.</li>
    <li>Payment (provisional): on a self-draw each of the other three pays one share; on a discard win the discarder pays two shares.</li>
  </ul>
  <h3>Controls</h3>
  <ul>
    <li>Tap a tile to select it and see its info; on a phone, tap again to unselect. To discard, press the Discard button under your hand. It discards only the selected tile. With a mouse, clicking a selected tile again also discards it.</li>
    <li>Reorder your hand: drag with the mouse, or long-press and drag on a phone. You can also select a tile and use ◀ ▶. "Sort" goes back to auto-sort.</li>
    <li>Hover over a tile (tap it on a phone) to see how many copies exist, how many you can see and how many remain. Seen = your hand + all discards + all melds.</li>
    <li>The computer players are simple (no defense, random calls). They are there to test the rules.</li>
  </ul>`

RULES_HTML.ja = `  <h2>ルール（現在の実装）</h2>
  <p class="rintro">幺九龍は麻雀系の新しいゲームです。ぜひ遊んでみてください！従来の麻雀との一番の違いは、すべての牌に点数があり、枚数もまちまちなところ。ツモるたびに新しいチャンスがあります。従来の役に加えて新しい役もあり、バリエーション豊かでテンポよく進むので、麻雀経験のある方もない方も楽しめます。</p>
  <p>あなた1人 vs CPU3人。毎局、親から配牌が始まります。風や連荘はなく、毎局シャッフルし直し、点数は累計されます。</p>
  <h3>牌と点数</h3>
  <ul>

      mode: ROOM.mode + (ROOM.code ? ' ' + ROOM.code : ''), page: location.href.split('?')[0], userAgent: navigator.userAgent,
    }) });

    if (!j.success) throw new Error('x');

    $('#fbMsg').value = ''; st.textContent = L('已送出，謝謝你！', 'Sent. Thank you!');
  } catch (x) { st.textContent = L('送出失敗，請稍後再試', 'Could not send. Try again later.'); }
  btn.disabled = false;
});
