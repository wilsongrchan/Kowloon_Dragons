*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--bg);color:var(--pg);font:400 15px/1.5 var(--ui);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font:900 30px/1 var(--face);margin:0;letter-spacing:.08em;color:var(--h)}
.brand{display:flex;flex-direction:column;gap:3px}
.sub{font-size:12px;color:var(--pgm);letter-spacing:.02em}
.sub:empty{display:none}
.meta{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--pgm);font-size:13px}
.meta .pill{background:var(--table);color:var(--text);padding:4px 10px;border-radius:99px}
button.btn{font:500 14px var(--ui);color:var(--text);background:var(--table2);border:1px solid var(--line);padding:7px 14px;border-radius:8px;cursor:pointer}
button.btn:hover{background:#38505f}
button.btn:focus-visible,.tile.clk:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.btn,.tile.clk{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button.btn.sm{padding:5px 11px;font-size:13px}
button.btn:disabled{opacity:.4;cursor:default}
button.btn.primary{background:var(--gold);color:#2a1f08;border-color:var(--gold);font-weight:700}
button.btn.primary:hover{background:#ecc064}
button.btn.ghost{background:transparent;color:var(--pg);border-color:var(--pgm)}

.table{color:var(--text);background:var(--table);border-radius:14px;padding:10px;display:grid;gap:8px}
.seat{background:var(--table2);border-radius:10px;padding:8px 10px;border:2px solid transparent}
.seat.active{border-color:var(--gold)}
.seat-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px;color:var(--muted)}
.seat-head b{color:var(--text);font-size:14px}
.seat-head .total{color:var(--muted);font-size:12px;background:rgba(0,0,0,.2);padding:2px 8px;border-radius:99px}
.seat-head .total b{color:var(--gold);font-size:14px}
.seat-head .score{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap;display:flex;align-items:baseline;gap:5px}
.seat-head .score b{font-size:22px;line-height:1;color:var(--text);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;min-height:20px}
.melds{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0}
.meld{display:flex;gap:1px;padding:2px;border-radius:5px;background:rgba(0,0,0,.18)}
.meld.mixed{outline:1px dashed var(--gold);outline-offset:1px}
.pool{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start}
.zone{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-top:6px;min-height:3.4em}
.zone .pool{flex:1 1 auto;min-width:0}
.zone .melds{flex:none;max-width:48%;justify-content:flex-end;margin:0;padding-left:10px;border-left:1px solid var(--line)}
.zone .melds:empty{display:none}
.backs{display:flex;gap:1px;flex-wrap:wrap}

/* tiles: sized by font-size so everything scales together */
.tile{--u:14px;font-size:var(--u);width:3.3em;height:4em;position:relative;flex:none;border-radius:.45em;
  background:linear-gradient(170deg,#fffdf2,var(--ivory) 55%,#eadfbf);color:#222;border:.12em solid #2b2a28;
  box-shadow:0 .26em 0 var(--jade-d),0 .26em 0 .12em #2b2a28;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12em;
  font-family:var(--ui);font-weight:900;line-height:1;margin-bottom:.45em;padding:0}
.tile.sm{--u:9px}
.tile.md{--u:11px}
.tile.xs{--u:8.5px;margin-bottom:.4em}
.tile i{font-style:normal;display:block}
.tile .n{font-size:1.9em;font-weight:700;-webkit-text-stroke:.03em currentColor}
.tile .ic{display:block;flex:none}
.tile .ic.c{width:1.05em;height:1.05em;border-radius:50%;border:.24em solid currentColor;position:relative}
.tile .ic.c::after{content:"";position:absolute;inset:.17em;border-radius:50%;background:currentColor}
.tile .ic.k{width:.5em;height:1.25em;border-radius:.22em;background:currentColor;position:relative}
.tile .ic.k::after{content:"";position:absolute;left:-.06em;right:-.06em;top:50%;height:.14em;margin-top:-.07em;background:var(--ivory);opacity:.9}
.tile .ic.w{font:700 1.35em/1 var(--ui)}
.tile .h{font:700 2.3em/1 var(--ui)}
.tile .v{position:absolute;top:-.35em;right:-.4em;min-width:1.4em;height:1.4em;padding:0 .2em;border-radius:99px;background:rgba(14,21,28,.9);
  font:700 .7em/1.4em var(--ui);text-align:center;color:var(--gold);margin:0;-webkit-text-stroke:0}
.tile.p{color:var(--blue)} .tile.s{color:var(--green)} .tile.m{color:var(--red)}
.tile.z1{color:var(--red)} .tile.z2{color:var(--green)} .tile.z3{color:var(--blue)}
.tile.z3 .h{position:relative;width:2.3em;height:3.1em;font-size:1em;border:.17em solid currentColor;border-radius:.4em;
  background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(36,92,156,.07))}
.tile.z3 .h::before{content:"";position:absolute;inset:.22em;border:.07em solid currentColor;border-radius:.25em}
.tile.z3 .h::after{content:"";position:absolute;inset:.22em;border-radius:.25em;
  background:
   radial-gradient(circle at 0 0,currentColor .2em,transparent .21em) top left/.5em .5em no-repeat,
   radial-gradient(circle at 100% 0,currentColor .2em,transparent .21em) top right/.5em .5em no-repeat,
   radial-gradient(circle at 0 100%,currentColor .2em,transparent .21em) bottom left/.5em .5em no-repeat,
   radial-gradient(circle at 100% 100%,currentColor .2em,transparent .21em) bottom right/.5em .5em no-repeat}
.tile{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tile.dragging{opacity:.25}
.dragghost{position:fixed;z-index:60;pointer-events:none;margin:0;transform:translate(-50%,-62%) scale(1.15);box-shadow:0 .5em 1.2em rgba(0,0,0,.55)}
body.dragging-now{cursor:grabbing;-webkit-user-select:none;user-select:none}
#tip{position:fixed;z-index:70;display:none;pointer-events:none;background:#0e151c;color:#f3ecd6;border:1px solid var(--gold);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.45;max-width:min(260px,calc(100vw - 16px))}
#tip b{color:var(--gold)}
.discardbar{}
#selinfo{min-height:2.9em;margin-top:6px;font-size:14px;line-height:1.45;color:var(--muted)}
#selinfo b{color:var(--gold)}
#discardBtn{width:100%;margin-top:8px;padding:11px 14px;font-size:16px}
.handbar{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.handbar .hint{margin-right:auto;font-size:12px;color:var(--muted)}
.tile.back{background:repeating-linear-gradient(45deg,var(--jade) 0 .35em,#2f8660 .35em .7em);border:1px solid var(--jade-d);box-shadow:0 .2em 0 #153f2c;height:3.6em;width:2.8em;gap:0}
.tile.last{outline:2px solid var(--gold);outline-offset:1px}
.tile.clk{cursor:pointer;transition:transform .12s}
.tile.clk:hover{transform:translateY(-.3em)}
.tile.sel{transform:translateY(-.8em);outline:2px solid var(--gold);outline-offset:1px}
.tile.dim{opacity:.55}
#hand{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;padding:10px 0 4px}
#hand .tile{--u:clamp(11px,calc((100vw - 40px) / 52),16px)}
#hand .gap{width:.9em}
.opp .tile.back{--u:7px}
#opps{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"across across" "left right";gap:8px;align-items:start}
.opp.across{grid-area:across;justify-self:center;width:calc(50% - 4px)}.opp.left{grid-area:left}.opp.right{grid-area:right}
.opp.left,.opp.right{min-width:0}
.opp .seat-head{flex-wrap:nowrap;align-items:flex-start;gap:4px 8px}
.opp .seat-head>b,.opp .seat-head>span{flex:none}
.opp .seat-head .melds{flex:0 1 auto;min-width:0}
.opp .seat-head .melds{margin:0 0 0 auto;max-width:100%;justify-content:flex-end;gap:6px}
.opp .seat-head .melds:empty{display:none}
.opp .seat-head .melds:not(:empty) + .score{margin-left:8px}
.melds:not(:empty){background:rgba(224,176,78,.13);border:1px solid rgba(224,176,78,.4);border-radius:8px;padding:3px 5px}
.opp .seat-head .meld{background:rgba(0,0,0,.22)}
.opp .zone{min-height:2.4em}
.actions{display:flex;flex-wrap:wrap;gap:8px;min-height:40px;margin-top:8px}
.status{margin:8px 0 0;color:var(--muted);min-height:1.5em;font-size:14px}
.status b{color:var(--gold)}
details.log{margin-top:12px;color:var(--pgm);font-size:13px}
details.log summary{cursor:pointer}
details.log ol{margin:6px 0 0;padding-left:1.4em;max-height:220px;overflow:auto}

dialog{background:var(--table);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:min(720px,94vw);width:100%;max-height:88vh;overflow:auto}
#result{background-image:var(--dragon);background-repeat:no-repeat;background-position:right -10px bottom -6px;background-size:min(400px,72%);background-color:var(--table)}
#result>*{position:relative}
.hero{display:flex;align-items:baseline;gap:12px;margin:10px 0 2px;flex-wrap:wrap}
.hero small{font-size:14px;color:var(--muted);letter-spacing:.08em}
.hero b{font:900 64px/1 var(--face);color:var(--gold);font-variant-numeric:tabular-nums}
.hero span{font-size:14px;color:var(--muted)}
dialog::backdrop{background:rgba(5,10,15,.6)}
dialog h2{font:900 22px var(--face);margin:0 0 8px}
dialog h3{font-size:14px;margin:14px 0 4px;color:var(--gold)}
dialog ul{margin:4px 0;padding-left:1.2em}
dialog li{margin:2px 0}
dialog li>ul{margin:2px 0 6px;opacity:.92}
dialog li b{color:var(--ivory)}
details.eg{margin:8px 0 4px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:rgba(0,0,0,.12)}
details.eg summary{cursor:pointer;color:var(--gold);font-size:14px;font-weight:500}
.exrow{display:flex;flex-direction:column;gap:3px;align-items:flex-start;margin:10px 0}
.exl{font-size:13px;color:var(--muted)}
.exs{display:flex;flex-wrap:wrap;gap:6px 10px}
.exg{display:flex;gap:3px;padding:2px 3px 4px;border-radius:5px;background:rgba(0,0,0,.18)}
.tile.cl{opacity:.5;outline:1px dashed var(--gold);outline-offset:1px}
.fanlist{display:grid;grid-template-columns:1fr auto;gap:2px 16px;max-width:360px;font-variant-numeric:tabular-nums}
.fanlist .tot{border-top:1px solid var(--line);padding-top:4px;margin-top:2px;font-weight:700}
.reveal{margin-top:10px;display:grid;gap:8px}
.reveal .who{font-size:13px;color:var(--muted);margin-bottom:2px}
.reveal .row .tile{--u:9px}
.pay{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-variant-numeric:tabular-nums}
.pos{color:#8fd19e}.neg{color:#f0928b}
@media (max-width:520px){
  .wrap{padding:10px 10px 32px}
  h1{font-size:24px}
  .actions .btn{padding:10px 14px;min-height:42px}
  #discardBtn{min-height:48px}
  button.btn.sm{padding:8px 12px;min-height:38px}
  .seat{padding:8px}
  .zone .melds{max-width:55%}
  .opp .seat-head>span:not(.score){display:none}
  .opp .seat-head{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 6px}
  .opp .seat-head .score{grid-column:2;grid-row:1;margin:0}
  .opp .seat-head .melds{grid-column:1/3;grid-row:2;justify-self:end;margin:0}
  dialog{padding:16px}
}
header::before{content:"";order:1;flex:none;width:138px;height:138px;margin:-10px 0 -10px -8px;background:var(--dragon-h) no-repeat center/contain;pointer-events:none}
header .brand{order:0}
header .meta{order:2}
@media (max-width:520px){header::before{width:104px;height:104px}}
#cheat{display:none}
.cs{background:var(--table);color:var(--text);border-radius:14px;padding:14px 14px 12px;font-size:13px;line-height:1.4}
.cs h2{font:900 17px var(--face);margin:0 0 6px}
.cs h3{font-size:12px;margin:10px 0 3px;color:var(--gold);letter-spacing:.04em}
.cs h3 small{color:var(--muted);font-weight:400}
.cs .r{display:flex;gap:8px;justify-content:space-between;padding:2px 0;border-bottom:1px dotted rgba(255,255,255,.1)}
.cs .r b{color:var(--ivory);font-weight:700;white-space:nowrap}
.cs .r span{color:var(--muted);text-align:right}
.cs p{margin:6px 0 0;color:var(--muted)}
.cs p.lg{font-size:12px;margin:0 0 4px}
.cs .okc{color:var(--gold);font-weight:700}
.cs .outc{opacity:.5;text-decoration:line-through}
.cs .r.ok{background:rgba(224,176,78,.18);border-radius:5px;padding:2px 5px;margin:0 -5px;border-bottom-color:transparent}
.cs .r.ok b{color:var(--gold)}
.cs .r.out{opacity:.38}
.cs .r.out b{text-decoration:line-through}
#cheatBtn{display:none}
@media (max-width:1179px){#cheatBtn{display:inline-block}}
@media (min-width:1180px){
  .wrap{max-width:1260px}
  .main{display:grid;grid-template-columns:minmax(0,900px) 330px;gap:16px;justify-content:center;align-items:start}
  #cheat{display:block;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
}
@media (prefers-reduced-motion: reduce){.tile.clk{transition:none}}

<body>
<div class="wrap">
  <header>
    <div class="brand"><h1 id="title">幺九龍</h1><span class="sub" id="subtitle"></span></div>
    <div class="meta">
      <span class="pill" id="wall">牌山 —</span>
      <button class="btn ghost" id="langBtn" type="button">English</button>
      <button class="btn ghost" id="cheatBtn" type="button">速查</button>
      <button class="btn ghost" id="rulesBtn">規則設定</button>
      <button class="btn" id="newBtn">重新開局</button>
    </div>
  </header>
  <div class="main">
  <div class="col">
  <div class="table">
    <div id="opps"></div>
    <section class="seat" id="me">
      <div class="seat-head"><b id="meName">你</b><span id="meTag"></span><span id="meTotal" class="total"></span><span class="score" id="meScore"></span></div>
      <div class="zone">
        <div class="pool" id="myDiscards"></div>
        <div class="melds" id="myMelds"></div>
      </div>
      <div class="handbar">
        <span class="hint">拖曳或長按牌來排序</span>
        <button class="btn sm" id="leftBtn" type="button" aria-label="向左移" disabled>◀</button>
        <button class="btn sm" id="rightBtn" type="button" aria-label="向右移" disabled>▶</button>
        <button class="btn sm" id="sortBtn" type="button">整理</button>
      </div>
      <div id="hand"></div>
      <div id="selinfo" aria-live="polite"></div>
      <button class="btn primary" id="discardBtn" type="button" disabled>先選一張牌</button>
      <div class="actions" id="actions"></div>
      <p class="status" id="status"></p>
    </section>
  </div>
  <details class="log"><summary id="logSum">牌局記錄</summary><ol id="log"></ol></details>
  </div>
  <aside id="cheat" aria-label="cheat sheet"></aside>
  </div>
</div>

<div id="tip" role="status"></div>
<dialog id="result"></dialog>
<dialog id="rules"></dialog>
<dialog id="cheatDlg"></dialog>

<script>
/*__ENGINE__*/

/* ===== UI ===== */
const $ = s => document.querySelector(s);
let LANG = 'zh'; try { LANG = localStorage.getItem('yjl-lang') === 'en' ? 'en' : 'zh'; } catch (e) {}
const L = (zh, en) => LANG === 'en' ? en : zh;
const SEAT = { zh: ['你', '下家', '對家', '上家'], en: ['You', 'Downstream', 'Across', 'Upstream'] };
const NAMES = new Proxy({}, { get: (_, i) => SEAT[LANG][i] });
const SUITEN = { p: 'Circles', s: 'Bamboo', m: 'Characters' }, DRAGEN = { 1: 'Red Dragon', 2: 'Green Dragon', 3: 'White Dragon' };
const SUITE1 = { p: 'Circle', s: 'Bamboo', m: 'Character' };
const enTile = (sx, n) => sx === 'z' ? DRAGEN[n] : n + ' ' + (n === 1 || sx === 's' ? SUITE1[sx] : SUITEN[sx]);
const tn = t => LANG === 'en' ? enTile(t.s, t.n) : tname(t);
const kn = k => tn({ s: k[0], n: +k.slice(1), k });
const knFull = k => LANG === 'en' ? enTile(k[0], +k.slice(1)) : kn(k);
const YAKU_EN = {'三元刻':'Dragon triplet','平胡':'All Chows','對對胡':'All Triplets','混一色':'Half Flush','清一色':'Full Flush','全大字':'All Big','斷大字':'No Big','門清加自摸':'Concealed Self-Draw','三暗刻':'Three Concealed Triplets','四暗刻':'Four Concealed Triplets','小三元':'Small Dragons','大三元':'Great Dragons','幺九順':'Kowloon Straight','幺九龍':'Kowloon Dragon','槓':'Kong','三元大補槓':'Grand dragon kong','門清':'Concealed','自摸':'Self-draw','斷一門無三元':'Missing suit, no dragons','胡小字':'Win on small tile'};
const yn = name => { if (LANG !== 'en') return name; const m = name.match(/^(.+?)(×\d+)?$/); return (YAKU_EN[m[1]] || m[1]) + (m[2] ? ' ' + m[2] : ''); };
const ICON = { p: 'c', s: 'k', m: 'w' };
const faceHTML = (sx, n, badge) => sx === 'z'
  ? `<i class="h">${n === 3 ? '' : HON[n]}</i>`
  : `<i class="n">${n}</i><i class="ic ${ICON[sx]}">${sx === 'm' ? '萬' : ''}</i>` + (badge == null ? '' : `<i class="v">${badge}</i>`);
const X = (label, spec) => `<div class="exrow"><span class="exl">${label}</span><span class="exs">` + spec.split('|').map(g =>
  '<span class="exg">' + g.trim().split(/\s+/).map(t => { const c = t.endsWith('*'); t = t.replace('*', ''); return `<span class="tile xs ${t[0] === 'z' ? t : t[0]}${c ? ' cl' : ''}">${faceHTML(t[0], +t.slice(1))}</span>`; }).join('') + '</span>').join('') + '</span></div>';
const EG = (title, rows) => `<details class="eg"><summary>${title}</summary>${rows.join('')}</details>`;
const RULES_HTML = {
zh: `  <h2>規則（目前實作）</h2>
  <p>1 對 3 電腦。每局由莊家起手，沒有風位與連莊，每局重新洗牌，分數累計。</p>
  <h3>牌與分值</h3>
  <ul>
    <li>筒索萬各 45 張（n 張 n 點牌），中發白各 5 張，共 150 張。</li>
    <li>點值 = 10 − 數字（一＝9 … 九＝1），中發白 0 分；牌角的金色小數字就是點值。</li>
  </ul>
  <h3>吃碰槓</h3>
  <ul>
    <li>大字牌（7–9）一律不能吃碰槓，暗槓也不可，也不可進入鳴牌區。</li>
    <li>混碰：1–3 同數字、不同花色（或自己手上兩張湊成），被要的那一張不計分，虛線框標示。</li>
    <li>小字混刻：1–3 同數字、不同花色的三張牌，不用碰也可以在手牌裡自己湊成刻子（暗刻），和一般刻子一樣計算（對對胡、三暗刻、四暗刻都可以用）。全部同花色的仍是一般刻子。</li>
    <li>沒有混吃：吃只可以吃同花色順子，只可吃上家；順子內不可含 7–9（有 5、6 也不可吃 7，有 7、8 也不可吃 6），所以只可吃 123、234、345、456。</li>
    <li>小字牌（1–3）不能槓，也不能暗槓。沒有混槓。槓只可同花色同數字（4–6 或中發白）。</li>
    <li>三元大槓：暗槓或加槓中發白後可再補第五張（點「槓」），多 0.5 番。</li>
    <li>多人同時碰（例如 5、6 或中發白）：棄牌者的下家優先，再對家，再上家。胡牌最優先，吃最後。</li>
    <li>沒有搶槓。槓之後從牌山尾補牌。</li>
  </ul>
  ${EG('牌面示例：吃碰槓、混碰、三元大槓', [X('吃','s2 s3 s4|p4 p5 p6|m1 m2 m3'),X('碰／槓','p5 p5 p5|s6 s6 s6 s6|z1 z1 z1'),X('混碰（被要的牌變淡）','p1 s1 m1*|s2 s2 p2*|m3 p3* s3'),X('小字混刻（手牌內暗刻）','p1 s1 m1|p2 s2 m2|p3 s3 m3'),X('三元大槓（5 張）','z1 z1 z1 z1 z1|z2 z2 z2 z2 z2|z3 z3 z3 z3 z3'),X('7–9 不能吃碰槓','p7 p8 p9|s8 s8 s8|m9 m9 m9')])}
  <h3>番種（疊加，4 番封頂；0.5 番稱碎番）</h3>
  <ul>
    <li>1 番（全番）：三元刻（中、發、白任一組刻子，明碰或暗刻都算，每組可疊加）、平胡（全順子、無中發白）、對對胡</li>
    <li>2 番：混一色、門清加自摸、全大字（全部 7–9 數牌）、斷大字（沒有 7–9 數牌）、三暗刻</li>
    <li>3 番：清一色、小三元（不另計中發白刻，手牌點值立刻 +20）、幺九順（同花色 123＋456＋789，其餘一組可順可碰、可不同花色）</li>
    <li>4 番：大三元（不另計中發白刻，手牌點值立刻 +40）、四暗刻、幺九龍（同花色 123＋456＋789＋中發白各一＋同花色或三元的眼，手牌點值立刻 +40）</li>
    <li>暗刻：暗槓算暗刻；榮和時靠胡牌完成的刻子算明刻，但榮胡進眼（胡牌放進眼）不毀暗刻。</li>
    <li>半番（碎番）：只有碎番、沒有全番不能胡；須已有 1 番才可追加，兩個半番不能起和。包括：槓（每次）、三元大補槓、門清、自摸（只給有鳴牌的手牌，已含在門清加自摸）、斷一門無三元（筒索萬缺一門且沒有中發白）、胡小字（胡的那張是 1–3）。</li>
    <li>門清加自摸已包含門清與自摸；全大字不計門清。</li>
    <li>總番數取整數部分，所以 1+0.5+0.5＝2 番。</li>
    <li>倍數：1 番 ×1、2 番 ×2、3 番 ×3、4 番 ×4。得分 = 全手牌點值總和（含已鳴的牌，扣除混碰被要的那張）× 倍數。</li>
  </ul>
  ${EG('牌面示例：番種', [X('1 番：三元刻','z1 z1 z1|p2 p3 p4|s4 s5 s6|m4 m5 m6|s5 s5'),X('1 番：平胡','p1 p2 p3|p4 p5 p6|s2 s3 s4|m3 m4 m5|s5 s5'),X('1 番：對對胡','p4 p4 p4|s5 s5 s5|m6 m6 m6|z1 z1 z1|s6 s6'),X('2 番：混一色','p1 p2 p3|p4 p5 p6|p5 p5 p5|z1 z1 z1|p8 p8'),X('2 番：全大字','p7 p7 p7|s8 s8 s8|m9 m9 m9|p7 p8 p9|s9 s9'),X('2 番：斷大字','p2 p3 p4|s3 s4 s5|m4 m5 m6|p4 p5 p6|s6 s6'),X('2 番：三暗刻','p4 p4 p4|s5 s5 s5|m6 m6 m6|p1 p2 p3|s2 s2'),X('3 番：清一色','p1 p2 p3|p4 p5 p6|p4 p5 p6|p5 p5 p5|p3 p3'),X('3 番：小三元','z1 z1 z1|z2 z2 z2|z3 z3|p2 p3 p4|s4 s5 s6'),X('3 番：幺九順','s1 s2 s3|s4 s5 s6|s7 s8 s9|p5 p5 p5|m6 m6'),X('4 番：大三元','z1 z1 z1|z2 z2 z2|z3 z3 z3|p2 p3 p4|s5 s5'),X('4 番：四暗刻','p4 p4 p4|s5 s5 s5|m6 m6 m6|z1 z1 z1|p5 p5'),X('4 番：幺九龍','m1 m2 m3|m4 m5 m6|m7 m8 m9|z1 z2 z3|m5 m5')])}
  <h3>付款（暫定）</h3>
  <ul><li>自摸：其餘三家各付一份。出銃：出銃者付兩份。</li></ul>
  <h3>操作</h3>
  <ul><li>點一下牌＝選取並顯示資訊；手機上再點一次是取消選取。要打出時，按手牌下面的「打出」按鈕，只會打出目前選取的那張。滑鼠用戶也可以對已選取的牌再點一次來打出。</li>
    <li>調整手牌順序：電腦用滑鼠拖曳；手機長按牌再拖曳。也可以先選一張牌，按 ◀ ▶ 移動；按「整理」回到自動排序。</li>
    <li>滑鼠移到牌上（手機點一下牌）會顯示這種牌共幾張、已見幾張、還剩幾張（已見＝你的手牌＋所有棄牌＋所有鳴牌）。</li>
    <li>電腦的策略很簡單（不防守，會隨機吃碰），只適合測規則。</li></ul>`,
en: `  <h2>Kowloon Dragons (幺九龍): rules as implemented</h2>
  <p>Kowloon Dragons is a tile game from the mahjong family. It needs its own 150-tile set, not a regular mahjong set. On this page you play against 3 computer players. A hand starts with the dealer; there are no winds or dealer streaks. The wall is reshuffled every hand and scores carry over.</p>
  <h3>Goal</h3>
  <ul>
    <li>Hand of 13 tiles; you win on the 14th with <b>4 sets + 1 pair</b> (a set is a chow or a triplet; a kong counts as one set).</li>
    <li>You need at least <b>1 full fan</b> to win. Minor fans (½) alone don't count.</li>
  </ul>
  <h3>Tiles and points</h3>
  <ul>
    <li>Circles (筒), Bamboo (索), Characters (萬): 45 tiles each, with <b>n copies of number n</b>.</li>
    <li>Dragons: Red (中), Green (發) and White (白), 5 copies each. 150 tiles in total.</li>
    <li>Point value = 10 − number: 1 = 9 pts … 9 = 1 pt. Dragons = 0. The small gold badge on a tile is its value.</li>
    <li>Small tiles = 1–3. Middle tiles = 4–6. Big tiles = 7–9.</li>
  </ul>
  <h3>Calling a discard</h3>
  <ul>
    <li><b>Chow (吃)</b>
      <ul>
        <li>Same suit only, and only from your upstream player (the one who plays right before you, on your left).</li>
        <li>The chow can't contain a 7–9. Holding 5-6 you can't chow a 7; holding 7-8 you can't chow a 6.</li>
        <li>So only <b>123, 234, 345 and 456</b> can be claimed. A 789 chow is fine inside your closed hand.</li>
        <li>No mixed chow.</li>
      </ul>
    </li>
    <li><b>Pung (碰)</b>
      <ul>
        <li>Allowed for 1–6 and dragons. Big tiles (7–9) can never be punged.</li>
        <li>If several players can pung the same discard, priority is: the discarder's downstream player (next to play), then across, then upstream.</li>
      </ul>
    </li>
    <li><b>Kong (槓)</b>
      <ul>
        <li>Allowed for 4–6 and dragons, same suit and number only. No mixed kong.</li>
        <li>Small tiles (1–3) and big tiles (7–9) can't be konged or concealed-konged.</li>
        <li>After a kong you draw a replacement tile from the end of the wall.</li>
      </ul>
    </li>
    <li><b>Win (胡)</b> beats pung and kong, and a chow comes last. No robbing the kong.</li>
  </ul>
  ${EG('Tile examples: chow, pung, kong', [X('Chow','s2 s3 s4|p4 p5 p6|m1 m2 m3'),X('Pung / kong','p5 p5 p5|s6 s6 s6 s6|z1 z1 z1'),X('Never claimable (7–9)','p7 p8 p9|s8 s8 s8|m9 m9 m9')])}
  <h3>Special actions</h3>
  <ul>
    <li><b>Mixed pung (混碰)</b>
      <ul>
        <li>Numbers 1–3 only: the same number in three different suits.</li>
        <li>Example: hold 1筒 + 1索 and claim a 1萬, or hold two 2索 and claim a 2筒.</li>
        <li>The claimed tile scores 0 (dashed outline); the tiles from your hand still score.</li>
      </ul>
    </li>
    <li><b>Mixed triplet in hand (小字混刻)</b>
      <ul>
        <li>The same three-suit set of a 1–3 number can also be formed inside your closed hand, with no call.</li>
        <li>It counts as a concealed triplet for All Triplets, Three Concealed Triplets and Four Concealed Triplets.</li>
        <li>On a discard win, a mixed triplet completed by the winning tile counts as open, unless that tile could sit in the pair or a chow.</li>
      </ul>
    </li>
    <li><b>Grand dragon kong (三元大槓)</b>
      <ul>
        <li>After a concealed kong or added kong of a dragon, you can add the 5th copy (press Kong).</li>
        <li>Worth an extra ½ fan. Each dragon has 5 copies; this must be self-drawn.</li>
      </ul>
    </li>
  </ul>
  ${EG('Tile examples: special actions', [X('Mixed pung (claimed tile faded)','p1 s1 m1*|s2 s2 p2*|m3 p3* s3'),X('Mixed triplet in hand (concealed)','p1 s1 m1|p2 s2 m2|p3 s3 m3'),X('Grand dragon kong (5 copies)','z1 z1 z1 z1 z1|z2 z2 z2 z2 z2|z3 z3 z3 z3 z3')])}
  <h3>Winning hands (fan stack, capped at 4)</h3>
  <ul>
    <li><b>1 fan</b>
      <ul>
        <li><b>Dragon triplet (三元刻)</b>: each triplet of Red, Green or White Dragon counts, whether it is a revealed pung or a concealed triplet. They stack.</li>
        <li><b>All Chows (平胡)</b>: all chows, no dragons, and the pair isn't a dragon.</li>
        <li><b>All Triplets (對對胡)</b>: 4 triplets + pair. Mixed pungs are allowed.</li>
      </ul>
    </li>
    <li><b>2 fan</b>
      <ul>
        <li><b>Half Flush (混一色)</b>: one suit plus dragons.</li>

async function resolveClaims(from, t) {

      ron: ho.ron,
      pong: beaten ? [] : ho.pong,
      kong: beaten ? [] : ho.kong,
      chow: botMeld ? [] : ho.chow

    if (ho2.ron || ho2.pong.length || ho2.kong.length || ho2.chow.length) {
      const ch = await humanClaim(ho2, t);
      if (ch) {
        if (ch.kind === 'ron') return { win: true, seat: 0, ev: ho.ron };
        return { claim: true, seat: 0, kind: ch.kind, opt: ch.opt };
      }
      if (botRon) return { win: true, seat: botC.seat, ev: botC.ev };
    }

  if (botC) return { claim: true, seat: botC.seat, kind: botC.kind, opt: botC.opt };

}

  const dl = dealer; log(() => L(`新局，${NAMES[dl]}做莊。`, dl === 0 ? 'New hand. You deal.' : `New hand. ${NAMES[dl]} deals.`));
  let seat = dealer, rep = false, needDraw = true;
  const alive = () => my === runId;
  while (alive()) {
    G.turn = seat;
    let t0 = null;
    if (needDraw) { t0 = drawTile(G, seat, rep); if (!t0) { endDraw(); return; } }
    const drew = needDraw; needDraw = true; rep = false;
    UI.drawnId = seat === 0 && drew ? t0.id : null;
    render();
    const opts = selfOptions(G, seat, !drew);
    let act;
    if (seat === 0) { act = await humanSelf(opts); }
    else { const sc = seat; setStatus(() => L(`${NAMES[sc]}思考中…`, `${NAMES[sc]} is thinking…`)); if (!fast()) await sleep(650); act = botSelf(G, seat, opts); }
    if (!alive()) return;
    if (act.win) { finish(winResult(G, seat, true, null, opts.win)); return; }
    if (act.kong) {
      const kk = act.kong, ks = seat;
      applyKong(G, seat, kk); log(() => L(`${NAMES[ks]}${kk.big ? '大槓' : '槓'} ${kn(kk.k)}`, `${NAMES[ks]} ${kk.big ? 'grand kong' : 'kong'} ${kn(kk.k)}`));
      rep = true; UI.drawnId = null; continue;
    }
    const t = discardTile(G, seat, act.discard);
    UI.drawnId = null; { const ds = seat; log(() => L(`${NAMES[ds]}打 ${tn(t)}`, `${NAMES[ds]} discards ${tn(t)}`)); } render();
    if (!fast()) await sleep(seat === 0 ? 250 : 350);
    const cl = await resolveClaims(seat, t);
    if (!alive()) return;
    if (cl.win) { G.hands[cl.seat].push(t); G.discards[seat].pop(); finish(winResult(G, cl.seat, false, seat, cl.ev)); return; }
    if (cl.claim) {
      applyClaim(G, cl.seat, cl.kind, cl.opt, t, seat);
      const mm = G.melds[cl.seat][G.melds[cl.seat].length - 1];
      { const cs = cl.seat, ck = cl.kind, cm = mm.mixed; log(() => L(`${NAMES[cs]}${KIND[ck][0]} ${tn(t)}${cm ? '（混）' : ''}`, `${NAMES[cs]} ${KIND[ck][1].toLowerCase()} ${tn(t)}${cm ? ' (mixed)' : ''}`)); }
      seat = cl.seat; if (cl.kind === 'kong') rep = true; else needDraw = false;
      continue;
    }
    seat = (seat + 1) % 4;
  }
}

function handRow(seat, who) {
  const wrap = document.createElement('div');
  const lab = document.createElement('div'); lab.className = 'who'; lab.textContent = who; wrap.appendChild(lab);
  const r = document.createElement('div'); r.className = 'row';
  G.melds[seat].forEach(m => r.appendChild(meldEl(m, 'sm')));
  sortTiles(G.hands[seat]).forEach(t => r.appendChild(tileEl(t, { sm: true })));
  wrap.appendChild(r); return wrap;
}
function finish(res) {
  res.delta.forEach((v, i) => scores[i] += v);
  UI.result = res;
  const ev = res.ev;
  log(() => { const who = NAMES[res.winner], how = res.tsumo ? L('自摸', 'self-draw') : L(`${NAMES[res.from]}出銃`, `discard from ${NAMES[res.from]}`); return L(`${who}胡牌（${how}）${evTxt(ev)}`, `${who} won (${how}) ${evTxt(ev)}`); });
  dealer = res.winner === dealer ? dealer : (dealer + 1) % 4;
  renderResult(); $('#result').showModal(); $('#result').scrollTop = 0;
  setStatus(() => L('本局結束。', 'Hand over.'));
  render();
}
function endDraw() {
  log(() => L('流局', 'Draw'));
  UI.result = { draw: true };
  dealer = (dealer + 1) % 4; renderResult(); $('#result').showModal(); $('#result').scrollTop = 0;
  setStatus(() => L('流局。', 'Draw.')); render();
}
function renderResult() {
  const res = UI.result, d = $('#result'); if (!res) return;
  const next = `<form method="dialog" style="margin-top:16px"><button class="btn primary" id="nextBtn">${L('下一局', 'Next hand')}</button></form>`;
  if (res.draw) {
    d.innerHTML = `<h2>${L('流局', 'Draw')}</h2><p>${L('牌山摸完，沒有人胡牌。', 'The wall ran out and nobody won.')}</p><div class="reveal" id="rv"></div>${next}`;
    const rv = d.querySelector('#rv'); for (let s = 0; s < 4; s++) rv.appendChild(handRow(s, NAMES[s]));
  } else {
    const ev = res.ev, who = NAMES[res.winner];
    const how = res.tsumo ? L('自摸', 'Self-draw') : L(`${NAMES[res.from]}出銃`, `Discard from ${NAMES[res.from]}`);
    const F = n => L(`${n} 番`, `${n} fan`);
    const rows = ev.items.map(i => `<span>${yn(i.name)}</span><span>${F(i.fan)}</span>`).join('') +
      ev.halves.map(i => `<span>${yn(i.name)}</span><span>+${F(i.fan)}</span>`).join('') +
      `<span class="tot">${L('合計（取整、4 番封頂）', 'Total (rounded down, capped at 4)')}</span><span class="tot">${F(ev.fan)} ×${ev.mult}</span>` +
      `<span>${L('全手點值' + (ev.bonus ? `（含${ev.bonusName}加分 +${ev.bonus}）` : ''), 'Hand tile points' + (ev.bonus ? ` (incl. +${ev.bonus} ${yn(ev.bonusName)} bonus)` : ''))}</span><span>${ev.tilePts}</span>`;
    const pay = res.delta.map((v, i) => `<span>${NAMES[i]} <b class="${v > 0 ? 'pos' : v < 0 ? 'neg' : ''}">${v > 0 ? '+' : ''}${v}</b>${L(`（累計 ${scores[i]}）`, ` (total ${scores[i]})`)}</span>`).join('');
    d.innerHTML = `<h2>${L(`${who}${res.tsumo ? '自摸' : '食胡'}！`, `${who} won by ${res.tsumo ? 'self-draw' : 'discard'}!`)}</h2><p style="margin:0;color:var(--muted)">${how}</p>
      <div class="hero"><small>${L('得分', 'Score')}</small><b>${ev.points}</b><span>${ev.tilePts} ${L('點', 'pts')} × ${ev.mult}</span></div>
      <h3>${L('番種', 'Fan breakdown')}</h3><div class="fanlist">${rows}</div>
      <h3>${L('結算', 'Settlement')}${res.tsumo ? L('（自摸：每家付一份）', ' (self-draw: each pays one share)') : L('（出銃者付兩份）', ' (discarder pays two shares)')}</h3><div class="pay">${pay}</div>
      <h3>${L('各家手牌', 'All hands')}</h3><div class="reveal" id="rv"></div>${next}`;
    const rv = d.querySelector('#rv');
    for (let s = 0; s < 4; s++) rv.appendChild(handRow(s, NAMES[s] + (s === res.winner ? L('（胡牌）', ' (winner)') : '')));
  }
  d.querySelector('#nextBtn').onclick = () => setTimeout(play, 0);
}
const CHEAT_TIERS = [
  [1, [['三元刻', '中／發／白刻子，明暗皆可，每組 +1', 'Red/Green/White triplet, open or concealed, +1 each'], ['平胡', '全順子、無中發白', 'all chows, no dragons'], ['對對胡', '4 刻 + 眼', '4 triplets + pair']]],
  [2, [['混一色', '一門 + 中發白', 'one suit + dragons'], ['門清加自摸', '無鳴牌、自摸', 'no calls, self-draw'], ['全大字', '全部 7–9', 'only 7–9'], ['斷大字', '沒有 7–9', 'no 7–9'], ['三暗刻', '3 組暗刻', '3 concealed triplets']]],
  [3, [['清一色', '一門、無中發白', 'one suit, no dragons'], ['小三元', '2 刻 + 1 眼 · +20', '2 dragon triplets + pair · +20'], ['幺九順', '同花 123·456·789 · 其餘任一組', 'same-suit 123·456·789 + any set']]],
  [4, [['大三元', '中發白全刻 · +40', 'all 3 dragon triplets · +40'], ['四暗刻', '4 組暗刻', '4 concealed triplets'], ['幺九龍', '同花 123·456·789 + 中發白 + 眼 · +40', 'same-suit 123·456·789 + Red·Green·White + pair · +40']]]
];
const CHEAT_MINOR = [['槓', '每次', 'each kong'], ['三元大補槓', '補第 5 張中發白', 'dragon 5th tile'], ['門清', '無鳴牌', 'no calls'], ['自摸', '只限有鳴牌', 'open hands only'], ['斷一門無三元', '缺一門、無中發白', 'a suit missing, no dragons'], ['胡小字', '胡牌是 1–3', 'winning tile is 1–3']];
/* 速查表即時狀態：依你目前的鳴牌／手牌標示「✓ 目前支持」或「灰色 = 已不可能」 */
function cheatStates() {
  const st = {}; if (!G) return st;
  const melds = G.melds[0], hand = G.hands[0];
  const open = melds.filter(m => m.open), chows = melds.filter(m => m.type === 'chow'), trip = melds.filter(m => m.type !== 'chow');
  const drag = trip.filter(m => m.tiles[0].s === 'z'), suits = new Set();
  melds.forEach(m => m.tiles.forEach(t => { if (t.s !== 'z') suits.add(t.s); }));
  const cnt = {}; hand.forEach(t => { cnt[t.k] = (cnt[t.k] || 0) + 1; });
  const handTrips = Object.keys(cnt).filter(k => cnt[k] >= 3);
  const concTrips = handTrips.length + melds.filter(m => !m.open && m.type === 'kong').length;
  const out = (k, zh, en) => { st[k] = { s: 'out', why: L(zh, en) }; };
  const ok = k => { if (!st[k]) st[k] = { s: 'ok' }; };
  // 已不可能
  if (open.length) { out('門清加自摸', '已有明牌', 'you have an open meld'); out('門清', '已有明牌', 'you have an open meld'); }
  if (open.length >= 2) out('三暗刻', '明牌太多', 'too many open melds');
  if (open.length >= 1) out('四暗刻', '已有明牌', 'you have an open meld');
  if (chows.length) out('對對胡', '已有吃牌', 'you have a chow');
  if (trip.length) out('平胡', '已有碰／槓', 'you have a pung/kong');
  if (melds.length) out('全大字', '7–9 不能鳴牌，已有鳴牌', 'big tiles can’t be called, and you have a meld');
  if (suits.size >= 2) { out('混一色', '鳴牌不只一門', 'melds in 2+ suits'); out('清一色', '鳴牌不只一門', 'melds in 2+ suits'); }
  if (drag.length) { out('清一色', '已有三元牌鳴牌', 'you have a dragon meld'); out('斷一門無三元', '已有三元牌鳴牌', 'you have a dragon meld'); }
  if (suits.size >= 3) out('斷一門無三元', '鳴牌三門齊', 'melds in all 3 suits');
  if (melds.length - drag.length >= 2) out('大三元', '非三元鳴牌太多', 'too many non-dragon melds');
  if (melds.length - drag.length >= 3 || drag.length >= 3) out('小三元', '鳴牌不合', 'your melds don’t fit');
  const chowStarts = chows.map(m => Math.min(...m.tiles.map(t => t.n))), chowSuits = new Set(chows.map(m => m.tiles[0].s));
  const badYao = chowStarts.some(n => n !== 1 && n !== 4) || chowSuits.size > 1;
  if (badYao || trip.length >= 2) out('幺九順', '鳴牌不合（只可鳴 123、456，同花）', 'melds don’t fit (only 123 & 456, same suit)');
  if (badYao || trip.length >= 1) out('幺九龍', '鳴牌不合（只可鳴 123、456，同花，不能有碰槓）', 'melds don’t fit (only 123 & 456 same suit, no pung/kong)');
  // 目前支持
  if (drag.length || handTrips.some(k => k[0] === 'z')) ok('三元刻');
  if (melds.some(m => m.type === 'kong')) ok('槓');
  if (melds.some(m => m.big)) ok('三元大補槓');
  if (trip.length && !chows.length) ok('對對胡');
  if (melds.length && !trip.length) ok('平胡');
  if (melds.length) { ok('混一色'); if (suits.size === 1 && !drag.length) ok('清一色'); }
  if (concTrips >= 3) ok('三暗刻');
  if (concTrips >= 4) ok('四暗刻');
  if (chows.length) { ok('幺九順'); ok('幺九龍'); }
  return st;
}
function cheatHTML() {
  const S = cheatStates();
  const row = (n, zh, en) => { const x = S[n]; return `<div class="r${x ? ' ' + x.s : ''}"${x && x.why ? ` title="${x.why}"` : ''}><b>${x && x.s === 'ok' ? '✓ ' : ''}${yn(n)}</b><span>${x && x.s === 'out' ? x.why : L(zh, en)}</span></div>`; };
  return `<div class="cs"><h2>${L('番種速查', 'Fan cheat sheet')}</h2><p class="lg"><span class="okc">✓</span> ${L('你的牌支持', 'your melds/hand support it')} · <span class="outc">${L('灰色', 'grey')}</span> ${L('＝已不可能', '= ruled out')}</p>` +
    CHEAT_TIERS.map(([f, hs]) => `<h3>${L(f + ' 番 ×' + f, f + ' fan ×' + f)}</h3>` + hs.map(h => row(h[0], h[1], h[2])).join('')).join('') +
    `<h3>${L('碎番 +0.5', 'Minor fans +½')} <small>${L('（要先有 1 番）', '(need ≥1 full fan)')}</small></h3>` + CHEAT_MINOR.map(h => row(h[0], h[1], h[2])).join('') +
    `<h3>${L('可鳴的牌', 'What can be called')}</h3>` +
    row('吃', '同花 123·234·345·456，只吃上家', '123·234·345·456, same suit, from upstream only').replace(/<b>[^<]*<\/b>/, `<b>${L('吃', 'Chow')}</b>`) +
    `<div class="r"><b>${L('碰', 'Pung')}</b><span>${L('1–6、中發白（7–9 不可）', '1–6, dragons (not 7–9)')}</span></div>` +
    `<div class="r"><b>${L('槓', 'Kong')}</b><span>${L('4–6、中發白（1–3、7–9 不可）', '4–6, dragons (not 1–3, 7–9)')}</span></div>` +
    `<div class="r"><b>${L('混碰', 'Mixed pung')}</b><span>${L('1–3 同數字、不同花', '1–3, same number, 3 suits')}</span></div>` +
    `<p>${L('得分 = 全手點值（一＝9 … 九＝1）× 番數（上限 4）；番數取整數，1+0.5+0.5＝2。', 'Score = hand tile points (1 = 9 … 9 = 1) × fan (cap 4). Fan is rounded down: 1+½+½ = 2.')}</p></div>`;
}
function refreshCheat() {
  $('#cheat').innerHTML = cheatHTML();
  $('#cheatDlg').innerHTML = cheatHTML() + `<form method="dialog" style="margin-top:12px"><button class="btn primary">${L('關閉', 'Close')}</button></form>`;
}

  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-Hant';
  document.title = L('幺九龍 試玩', 'Kowloon Dragons · playtest');

  $('#leftBtn').setAttribute('aria-label', L('向左移', 'Move left')); $('#rightBtn').setAttribute('aria-label', L('向右移', 'Move right'));
  $('#sortBtn').textContent = L('整理', 'Sort');
  $('#logSum').textContent = L('牌局記錄', 'Game log');
  $('#meName').textContent = NAMES[0];
  $('#rules').innerHTML = RULES_HTML[LANG] + `\n<form method="dialog" style="margin-top:14px"><button class="btn primary">${L('關閉', 'Close')}</button></form>`;
  if (G) {
    render(); renderLog();
    if (UI.statusFn) setStatus(UI.statusFn);

    if ($('#result').open && UI.result) renderResult();
  } else { $('#discardBtn').textContent = L('先選一張牌', 'Select a tile'); }
}
$('#langBtn').onclick = () => { LANG = LANG === 'en' ? 'zh' : 'en'; try { localStorage.setItem('yjl-lang', LANG); } catch (e) {} applyLang(); };
$('#newBtn').onclick = () => { scores = [0, 0, 0, 0]; dealer = 0; $('#result').close?.(); play(); };
$('#rulesBtn').onclick = () => $('#rules').showModal();
$('#cheatBtn').onclick = () => $('#cheatDlg').showModal();
applyLang(); play();
</script>
