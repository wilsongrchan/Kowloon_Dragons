@media (prefers-color-scheme: light){:root:not([data-theme]){--table:#dfe7ea;--table2:#ecf1f3;--pillbg:#ecf1f3;--lbar:rgba(34,49,62,.16);--lbarh:rgba(34,49,62,.3);--gold:#d1952a;--gold-hov:#dfa63c;--gold-rgb:209,149,42;--totalbg:#f3ecd6;--totalring:rgba(0,0,0,.25);--line:#b6c4cc;--text:#1f2a33;--muted:#58697a;--badge-bg:#c9972e;--badge-fg:#fff;--gold-t:var(--gold);--ivt:#22313e;--fieldA:rgba(255,255,255,.85);--field:#fff;--vig1:#f1f5f7;--vig2:#cbd7dd;--hov:#d3dfe5;--hov2:rgba(0,0,0,.06);--pos:#1f7a3d;--neg:#b3352b;--cn:#2f8f5b;--shade:rgba(0,0,0,.07)}}
:root[data-theme="light"]{--table:#dfe7ea;--table2:#ecf1f3;--pillbg:#ecf1f3;--lbar:rgba(34,49,62,.16);--lbarh:rgba(34,49,62,.3);--gold:#d1952a;--gold-hov:#dfa63c;--gold-rgb:209,149,42;--totalbg:#f3ecd6;--totalring:rgba(0,0,0,.25);--line:#b6c4cc;--text:#1f2a33;--muted:#58697a;--badge-bg:#c9972e;--badge-fg:#fff;--gold-t:var(--gold);--ivt:#22313e;--fieldA:rgba(255,255,255,.85);--field:#fff;--vig1:#f1f5f7;--vig2:#cbd7dd;--hov:#d3dfe5;--hov2:rgba(0,0,0,.06);--pos:#1f7a3d;--neg:#b3352b;--cn:#2f8f5b;--shade:rgba(0,0,0,.07)}
*{box-sizing:border-box}
html,body{height:auto}
body{margin:0;background:var(--table);color:var(--pg);font:400 calc(15px*var(--fs,1))/1.5 var(--ui);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--table);z-index:10}
.wrap{max-width:900px;margin:0 auto;padding:8px 16px 24px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font:900 calc(30px*var(--fs,1))/1 var(--face);margin:0;letter-spacing:.08em;color:var(--h)}
.brand{display:flex;flex-direction:column;gap:3px}
.sub{font-size:calc(12px*var(--fs,1));color:var(--pgm);letter-spacing:.02em}
.sub:empty{display:none}
.meta{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--pgm);font-size:calc(13px*var(--fs,1))}
.tbar{display:flex;justify-content:center;margin:-2px 0}
#cheatBar{display:none}
@media (min-width:521px){.table{position:relative}.tbar{position:absolute;top:10px;right:12px;margin:0;z-index:2;flex-direction:column;align-items:flex-end;gap:6px}}
.tbar .mf{order:1;font-size:calc(12px*var(--fs,1));font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
.tbar .mfw{order:1;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.tbar .rt .sh{display:none}
.tbar .rt{color:var(--text)}
@media (max-width:520px){.tbar{position:relative}.tbar .mfw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);flex-direction:row;align-items:center;gap:4px;white-space:nowrap}.tbar .rt .lg{display:none}.tbar .rt .sh{display:inline}.tbar .mfw .mf{font-size:calc(10px*var(--fs,1));padding:0 8px;line-height:1.5}}   /* 手機：正對上家／下家兩個面板中間的縫 */
.tbar .mf.two{color:var(--gold-t);border-color:var(--gold)}
@keyframes wallshake{0%,100%{transform:translateX(0) rotate(0)}15%{transform:translateX(-4px) rotate(-2deg)}35%{transform:translateX(4px) rotate(2deg)}55%{transform:translateX(-3px) rotate(-1.5deg)}75%{transform:translateX(3px) rotate(1.5deg)}}
@keyframes wallflash{0%,100%{background-color:var(--pillbg,rgba(0,0,0,.28))}50%{background-color:rgba(255,92,64,.62)}}
.tbar .pill.low{animation:wallshake .5s ease-in-out 3,wallflash .5s ease-in-out 3}
@media (prefers-reduced-motion:reduce){.tbar .pill.low{animation:wallflash .8s ease-in-out 2}}
.tbar .pill{display:flex;align-items:center;gap:8px;background:var(--pillbg,rgba(0,0,0,.28));color:var(--muted);padding:5px 14px 5px 10px;border-radius:99px;font-size:calc(14px*var(--fs,1))}
.tbar .pill svg{width:56px;height:38px;display:block}
.tbar .pill b{color:var(--gold-t);font-size:calc(22px*var(--fs,1));line-height:1;font-variant-numeric:tabular-nums}
.meta .pill{background:var(--table);color:var(--text);padding:4px 10px;border-radius:99px}
button.btn{font:500 calc(14px*var(--fs,1)) var(--ui);color:var(--text);background:var(--table2);border:1px solid var(--line);padding:7px 14px;border-radius:8px;cursor:pointer}
button.btn:hover{background:var(--hov)}
button.btn:focus-visible,.tile.clk:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.btn,.tile.clk{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button.btn.sm{padding:5px 11px;font-size:calc(13px*var(--fs,1))}
button.btn:disabled{opacity:.4;cursor:default}
button.btn.primary{background:var(--gold);color:#2a1f08;border-color:var(--gold);font-weight:700}
button.btn.primary:hover{background:var(--gold-hov)}
button.btn.ghost{background:transparent;color:var(--pg);border-color:var(--pgm)}

.table{color:var(--text);background:transparent;border-radius:0;padding:8px 0;display:grid;gap:6px}   /* 牌桌＝整個畫面的顏色（同結算頁），不再是頁面裡的一塊面板 */
.seat{background:var(--table2);border-radius:10px;padding:6px 10px;border:2px solid transparent}
.seat.active{border-color:var(--gold)}
.seat-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:calc(13px*var(--fs,1));color:var(--muted)}
.seat-head b{color:var(--text);font-size:calc(14px*var(--fs,1))}
.ruby-x{}
rt{font-size:.55em;font-weight:400;color:var(--muted);letter-spacing:0}
.dealer{display:inline-block;margin-left:10px;background:#f3ecd6;color:#2a1f08;border-radius:99px;padding:1px 9px;font-weight:700;font-size:calc(12px*var(--fs,1));line-height:1.5;letter-spacing:.04em;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.seat-head .total{color:var(--muted);font-size:calc(12px*var(--fs,1));background:var(--totalbg,rgba(0,0,0,.2));padding:2px 8px;border-radius:99px;box-shadow:0 0 0 1px var(--totalring,transparent)}
.seat-head .total b{color:var(--text);font-size:calc(14px*var(--fs,1));margin-left:.6em}
.seat-head .dealer,.seat-head .total{display:inline-flex;align-items:center;box-sizing:border-box;height:calc(24px*var(--fs,1));padding-top:0;padding-bottom:0;line-height:1;vertical-align:middle}
.seat-head .score{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:calc(12px*var(--fs,1));white-space:nowrap;display:flex;align-items:baseline;gap:5px}
.seat-head .score b{font-size:calc(22px*var(--fs,1));line-height:1;color:var(--text);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end;min-height:20px}
.melds{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0}
.meld{display:flex;gap:1px;padding:2px;border-radius:5px;background:rgba(0,0,0,.18)}
.pool{display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start}
.zone{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-top:6px;min-height:3.4em}
.zone .pool{flex:1 1 auto;min-width:0}
.zone .melds{flex:none;max-width:48%;justify-content:flex-end;margin:0;padding-left:10px;border-left:1px solid var(--line)}
.zone .melds:empty{display:none}
.backs{display:flex;gap:1px;flex-wrap:nowrap}
.backs>*{flex:none}

/* tiles: sized by font-size so everything scales together */
.tile{--u:14px;font-size:var(--u);width:3.3em;height:4em;position:relative;flex:none;border-radius:.45em;
  background:linear-gradient(170deg,var(--tf1,#fffdf2),var(--tf2,var(--ivory)) 55%,var(--tf3,#eadfbf));color:#222;border:.12em solid #2b2a28;
  box-shadow:0 .26em 0 var(--jade-d),0 .26em 0 .12em #2b2a28;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.12em;
  font-family:var(--ui);font-weight:900;line-height:1;margin-bottom:.45em;padding:0}
.tile.sm{--u:9px}
.tile.md{--u:11px}
.tile.xs{--u:8.5px;margin-bottom:.4em}
.tile i{font-style:normal;display:block}
.tile .n{font-size:1.9em;font-weight:700;-webkit-text-stroke:.03em currentColor}
.tile .ic{display:block;flex:none}
.tile .ic.c{width:1.05em;height:1.05em;border-radius:50%;border:.24em solid currentColor;position:relative}
.tile .ic.c::after{content:"";position:absolute;inset:.17em;border-radius:50%;background:currentColor}
.tile .ic.k{width:.5em;height:1.25em;border-radius:.22em;background:currentColor;position:relative}
.tile .ic.k::after{content:"";position:absolute;left:-.06em;right:-.06em;top:50%;height:.14em;margin-top:-.07em;background:var(--tf2,var(--ivory));opacity:.9}

.tt-calc .big{font:900 calc(34px*var(--fs,1)) var(--face);color:var(--gold-t)}
.tts.sm{--tu:clamp(6.5px,2vw,9px)}
.tts .gapl{margin-left:calc(var(--tu)*.9)}
.tt-col{display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .45s,transform .45s}
.tt-col em{font-style:normal;font-size:calc(11.5px*var(--fs,1));color:var(--muted);font-weight:700}
.tt-chip{display:inline-block;padding:3px 10px;border-radius:99px;border:1px solid var(--gold);background:rgba(var(--gold-rgb),.14);font-size:calc(12.5px*var(--fs,1));font-weight:700;transition:opacity .4s,transform .4s}
.tts .tt-chip.hid{transform:translateY(8px)!important}
.tt-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
@media (prefers-reduced-motion:reduce){.tts .tile,.tt-bars .bar,.tt-grp{transition:none}}
html[lang=zh-Hans]{--ui:"Noto Sans SC","PingFang SC","Microsoft YaHei","Noto Sans TC",system-ui,sans-serif;--face:"Noto Serif SC","Songti SC","SimSun","Noto Serif TC",serif}
html[lang=ja]{--ui:"Noto Sans JP","Hiragino Sans","Yu Gothic","Noto Sans TC",system-ui,sans-serif;--face:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho","Noto Serif TC",serif}
body:has(#landing:not([hidden])),body:has(#lobby:not([hidden])){overflow:hidden}
#lobby{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:auto;color:var(--text)}
#lobby[hidden]{display:none}
#lobby.pre{background:radial-gradient(ellipse at 50% 28%,var(--vig1) 0%,var(--table) 55%,var(--vig2) 100%)}
#lobby.pre::before{content:"";position:fixed;inset:0;background:var(--dragon) center 40%/min(760px,120vw) no-repeat;opacity:.45;pointer-events:none}
#lobby.ingame{background:rgba(5,10,15,.6)}
#lobby .lbrand{position:relative;font:900 calc(30px*var(--fs,1))/1 var(--face);letter-spacing:.12em;color:var(--ivt);text-shadow:0 2px 0 var(--gold-d);margin:auto 0 12px;text-align:center}
#lobby .lbrand small{display:block;font:600 calc(11px*var(--fs,1)) var(--face);letter-spacing:.34em;color:var(--gold-t);text-transform:uppercase;margin-top:6px;text-shadow:none}
#lobby .card{position:relative;width:100%;max-width:460px;margin:auto;background:rgba(18,28,37,.82);border:1px solid var(--line);border-radius:16px;padding:14px;backdrop-filter:blur(3px)}
#lobby .lbrand + .card{margin-top:0}
#lobby.pre .card{background:none;border:0;padding:0;backdrop-filter:none;max-width:480px}
#lobby.pre .lbrand{margin-top:max(12px,4vh)}
#lobby .ctr{text-align:center}
#lobby .fl.ctr{justify-content:center}
#lobby .myw{position:relative;flex:1;min-width:0;display:block}
#lobby .myw .pen{bottom:auto;top:50%;transform:translateY(-50%);right:10px;font-size:calc(15px*var(--fs,1))}
#lobby .myname{width:100%;padding-right:30px;font:500 calc(15px*var(--fs,1)) var(--ui);padding:5px 8px;border-radius:6px;border:1px dashed var(--gold-d);background:rgba(0,0,0,.25);color:var(--text)}

#lobby .btn.ghost:hover,dialog .btn.ghost:hover{background:var(--hov2)}
#lobby button.btn:disabled{opacity:.55}
#lobby .btn.primary:disabled{background:#6b5a2e;border-color:#6b5a2e;color:#d9cfae}
#lobby .lrow .rd{font-size:calc(12px*var(--fs,1));color:var(--muted)}
#lobby .lrow .rd.on{color:var(--pos);font-weight:700}
#lobby h3{margin:10px 0 4px}
#lobby .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
#lobby .chip{font:500 calc(13px*var(--fs,1)) var(--ui);color:var(--text);background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer}
#lobby .chip.on{background:var(--gold);color:#2a1f08;border-color:var(--gold);font-weight:700}
#lobby select{font:500 calc(14px*var(--fs,1)) var(--ui);padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--text)}
#lobby .tcrow.off{opacity:.4}
#lobby .tcrow select:disabled{cursor:not-allowed}
#lobby .tcrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:calc(13px*var(--fs,1));color:var(--muted)}
#lobby button.big{width:100%;padding:9px 10px;font-size:calc(16px*var(--fs,1))}
#lobby .acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.tclk{font:600 calc(12px*var(--fs,1)) var(--ui);font-variant-numeric:tabular-nums;background:rgba(0,0,0,.28);color:var(--text);padding:2px 8px;border-radius:99px;white-space:nowrap}

.tclk{min-width:6.6em;text-align:center;box-sizing:border-box}
.tclk:empty{display:none}
#zoom{position:fixed;inset:0;z-index:30;overflow:hidden;opacity:0}
#zoom[hidden]{display:none}
#zoom .hole{position:absolute;left:50%;top:50%;width:0;height:0;border:0 solid var(--gold);border-radius:50%;transform:translate(-50%,-50%);box-sizing:content-box;box-shadow:0 0 0 200vmax var(--table)}
#zoom .dr{position:absolute;left:50%;top:50%;width:min(560px,92vw);height:min(500px,82vw);margin:calc(min(500px,82vw)/-2) 0 0 calc(min(560px,92vw)/-2);background:var(--dragon-full) center/contain no-repeat;opacity:0}
#zoom.go{animation:zin 2.3s linear forwards}
#zoom.go .hole{animation:zhole 2.3s linear forwards}
#zoom.go .dr{animation:zdr 2.3s ease-in-out forwards}
@keyframes zin{0%{opacity:0}16%{opacity:1}100%{opacity:1}}
@keyframes zdr{0%{opacity:0;transform:scale(.45)}20%{opacity:1;transform:scale(.85)}45%{opacity:1;transform:scale(1)}58%{opacity:0;transform:scale(1.3)}100%{opacity:0;transform:scale(1.3)}}
@keyframes zhole{0%,55%{width:0;height:0;border-width:0;animation-timing-function:ease-in}55.1%{width:0;height:0;border-width:4px}100%{width:150vmax;height:150vmax;border-width:4px}}

<script>
/*__ENGINE__*/

/* ===== UI ===== */
const $ = s => document.querySelector(s);
/*__JA__*/
let LANG = 'zh'; try { const v = localStorage.getItem('yjl-lang'); LANG = v === 'en' || v === 'ja' ? v : 'zh'; } catch (e) {}
const PREF = { theme: 'auto', fs: 'm', script: 't', music: 'on', sfx: 'on', musicVol: '57', botLvl: 'easy', recOn: 'on', dockSide: 'right', hc: 'off', palette: 'classic', tiles: 'trad', setLen: 'endless' };
try { for (const k in PREF) PREF[k] = localStorage.getItem('yjl-' + k) || PREF[k]; if (localStorage.getItem('yjl-recv') !== '2') { PREF.recOn = 'on'; localStorage.setItem('yjl-recOn', 'on'); localStorage.setItem('yjl-recv', '2'); } if (localStorage.getItem('yjl-audiov') !== '2') { PREF.music = 'on'; PREF.sfx = 'on'; localStorage.setItem('yjl-audiov', '2'); } if (localStorage.getItem('yjl-musicv') !== '2') { PREF.musicVol = '57'; localStorage.setItem('yjl-musicv', '2'); } } catch (e) {} // audiov 2：音樂與音效預設改為開，舊的「關」只重設一次
if (PREF.botLvl === 'pro2') PREF.botLvl = 'master';   // 舊的「高手・兩番起胡」改成大師
const applyBotLvl = () => { RULES.BOT_LEVEL = ['pro', 'master'].includes(PREF.botLvl) ? PREF.botLvl : 'easy'; applyMinFan(); };
function applyMinFan() { let on = false; try { on = online(); } catch (e) {}   // 啟動時 ROOM 還沒建立
  RULES.MIN_TOTAL = on ? (ROOM.minFan === 2 ? 2 : 0) : (PREF.botLvl === 'master' ? 2 : 0); }   // 兩番起胡：單人看電腦強度設定，房間由房主決定
applyBotLvl();
const applyPrefs = () => { const r = document.documentElement; PREF.theme === 'light' || PREF.theme === 'dark' ? r.setAttribute('data-theme', PREF.theme) : r.removeAttribute('data-theme'); ['harvest', 'lantern', 'neon'].includes(PREF.palette) ? r.setAttribute('data-palette', PREF.palette) : r.removeAttribute('data-palette'); r.setAttribute('data-hc', PREF.hc === 'on' ? 'on' : 'off'); PREF.tiles === 'theme' ? r.setAttribute('data-tiles', 'theme') : r.removeAttribute('data-tiles'); r.setAttribute('data-fs', PREF.fs); };
applyPrefs();
const L = (zh, en) => LANG === 'en' ? en : LANG === 'ja' ? jaT(zh) : zh;
const SEAT = { zh: ['你', '下家', '對家', '上家'], en: ['You', 'Downstream', 'Across', 'Upstream'], ja: SEAT_JA };
const NAMES = new Proxy({}, { get: (_, i) => SEAT[LANG][i] });
/* ===== 線上房間狀態 / online room state (PeerJS, host-authoritative) ===== */
let BOTP = [0, 1, 2, 3].map(() => pickPersona());
const ROOM = { mode: 'solo', code: null, peer: null, conns: {}, kind: ['host', 'bot', 'bot', 'bot'], names: ['', '', '', ''], pending: {}, afk: {}, seen: {}, rid: 0, handNo: 0, started: false, myName: '', conn: null, msg: '', ready: [true, false, false, false], tc: null, bank: [0, 0, 0, 0], zooming: false };
const CLK = { banks: [0, 0, 0, 0], act: {} };
{ const lb = $('#lobby'); lb.open = false; lb.showModal = () => { lb.hidden = false; lb.open = true; }; lb.close = () => { lb.hidden = true; lb.open = false; }; }
let mySeat = 0;
const online = () => ROOM.mode !== 'solo';
const isHost = () => ROOM.mode === 'host';
const WHO = new Proxy({}, { get: (_, i) => (ROOM.mode === 'solo' || !ROOM.names[(+i + mySeat) % 4]) ? SEAT[LANG][i] : ROOM.names[(+i + mySeat) % 4] });
const SUITEN = { p: 'Circles', s: 'Bamboo', m: 'Characters' }, DRAGEN = { 1: 'Red Dragon', 2: 'Green Dragon', 3: 'White Dragon' };
const SUITE1 = { p: 'Circle', s: 'Bamboo', m: 'Character' };
const enTile = (sx, n) => sx === 'z' ? DRAGEN[n] : n + ' ' + (n === 1 || sx === 's' ? SUITE1[sx] : SUITEN[sx]);
const ZH_DRAGON = { 1: '紅中', 2: '發財', 3: '白板' };
/* 數字顯示反轉：引擎內部仍用舊編號 n（n 張 n 點），畫面一律顯示 10 − n（牌面數字＝點值，數字 d 有 10 − d 張）。
   所以引擎的 n=1 在畫面上是「九」；引擎寫 1–3 的地方（彩碰、不可槓…）在畫面上是 7–9，反之亦然。 */
const dnum = n => 10 - n;
ORDER.forEach(k => { if (k[0] !== 'z') ORD[k] = ORDER.indexOf(k[0] + '1') + (9 - +k.slice(1)); });
const tn = t => { if (t.s !== 'z') t = { ...t, n: 10 - t.n }; return LANG === 'en' ? enTile(t.s, t.n) : LANG === 'zh' && t.s === 'z' ? ZH_DRAGON[t.n] : tname(t); };
const kn = k => tn({ s: k[0], n: +k.slice(1), k });
const knFull = k => LANG === 'en' ? enTile(k[0], k[0] === 'z' ? +k.slice(1) : dnum(+k.slice(1))) : kn(k);
const YAKU_EN = {'三元刻':'Dragon triplet','平胡':'All Sequences','對對胡':'All Triplets','彩一色':'Mixed Flush','混一色':'Half Flush','清一色':'Full Flush','全小字':'All Small','斷小字':'No Small','斷小字無三元':'No Small, No Dragons','不求人':'Concealed Self-Draw','三暗刻':'Three Concealed Triplets','四暗刻':'Four Concealed Triplets','七對子':'Seven Pairs','小三元':'Small Dragons','大三元':'Great Dragons','幺九順':'Kowloon Straight','門清幺九順':'Concealed Kowloon Straight','幺九龍':'Kowloon Dragons','門清幺九龍':'Concealed Kowloon Dragons','槓三元':'Dragon Kongs','天胡':'Blessing of Heaven','地胡':'Blessing of Earth','人胡':'Blessing of Man','槓':'Kong','三元大補槓':'Grand dragon Kong','門清':'Concealed','自摸':'Self-draw','海底撈月':'Win on Last Tile','槓上自摸':'Win on Kong','斷一門無三元':'Missing suit, no dragons','胡大字':'Win on big tile'};
const yn = name => { if (LANG === 'zh') return name; const m = name.match(/^(.+?)(×\d+)?$/), T = LANG === 'ja' ? YAKU_JA : YAKU_EN; return (T[m[1]] || m[1]) + (m[2] ? ' ' + m[2] : ''); };
const ICON = { p: 'c', s: 'k', m: 'w' };
const faceHTML = (sx, n, badge) => sx === 'z'
  ? `<i class="h">${n === 3 ? '' : HON[n]}</i>`
  : `<i class="n">${dnum(n)}</i><i class="ic ${ICON[sx]}">${sx === 'm' ? '萬' : ''}</i>` + (badge == null ? '' : `<i class="v">${badge}</i>`);
// 例子裡的牌組：數字組由小到大排（畫面數字 = 10 − 引擎數字），三元牌組與最後的眼留在原位
const exOrder = spec => {
  const gs = spec.split('|').map((g, gi) => ({ g, gi })), tl = g => g.trim().split(/\s+/);
  const dv = g => Math.min(...tl(g).map(t => 10 - +t.replace('*', '').slice(1)));
  const slots = gs.map((_, i) => i).filter(i => !/z/.test(gs[i].g) && !(gs.length === 5 && i === 4 && tl(gs[4].g).length === 2));
  const sorted = slots.map(i => gs[i]).sort((a, b) => dv(a.g) - dv(b.g));
  slots.forEach((i, k) => gs[i] = sorted[k]);
  return gs;
};
const X = (label, spec, conc) => `<div class="exrow"><span class="exl">${label}</span><span class="exs">` + exOrder(spec).map(({ g, gi }) =>
  `<span class="exg${conc && (conc === 'all' || conc.includes(gi)) ? ' cn' : ''}${/\*/.test(g) ? ' hc' : ''}">` + g.trim().split(/\s+/).reverse().map(t => { const c = t.endsWith('*'); t = t.replace('*', ''); return `<span class="tile xs ${t[0] === 'z' ? t : t[0]}${c ? ' cl' : ''}">${faceHTML(t[0], +t.slice(1))}</span>`; }).join('') + '</span>').join('') + '</span></div>';
const EG = (title, rows) => `<details class="eg"><summary>${title}</summary>${rows.join('')}</details>`;

        <li><b>三暗刻</b>：有 3 組暗刻（自己手牌湊成、不是碰別人的牌；暗槓也算）。第四組面子可鳴、可順子、可刻子、可碰。</li>
      </ul>
    </li>
    <li><b>2 番</b>
      <ul>
        <li><b>混一色</b>：一門 + 三元。不可彩碰、彩刻、彩眼；第一副三元刻不另計。</li>
        <li><b>彩一色</b>：清一色（無三元），但其中恰有一處是「彩」：眼是彩眼，或其中一刻是彩碰／彩刻；該彩眼／彩碰／彩刻必須至少有一張是主色（例如 8筒8筒8萬 在筒子手牌）；彩眼和彩碰不可同時有，多於一刻彩碰也不可；有三元的混一色不算。</li>
        <li><b>斷小字無三元</b>：整副手牌沒有 1–3，也沒有三元牌（中發白）。</li>
        <li><b>七對子</b>：門清狀態下組成 7 對。四張相同算兩對（如 2222）；可疊混一色、清一色；不可彩眼；不重複算門清。</li>
      </ul>
    </li>
    <li><b>3 番</b>
      <ul>
        <li><b>小三元</b>：兩組三元刻 + 第三種三元作眼。不另計三元刻，手牌點值立即 +30。</li>
        <li><b>全小字</b>：整副手牌只有 1–3。不重複算門清。</li>
        <li><b>幺九順</b>：同花色 123＋456＋789；其餘一個面子可以是順子或刻子（可不同花色）。手牌點值立即 +30。</li>
      </ul>
    </li>
    <li><b>4 番</b>
      <ul>
        <li><b>清一色</b>：只有一門、無三元。不可彩碰、彩刻、彩眼，否則只視為彩一色；不重複算斷一門無三元。</li>
        <li><b>四暗刻</b>：4 組刻子全部是暗刻（自己手牌湊成、不是碰別人的牌；暗槓也算）。不重複算對對胡和不求人；自摸時只加自摸半番（4 番＋半番）。榮胡時，胡的牌若進眼（不屬於 4 組刻子）才算；若補成刻子，該組算明刻，只算三暗刻。</li>
        <li><b>大三元</b>：三元全刻。不另計三元刻，手牌點值立即 +60。</li>
        <li><b>門清幺九順</b>：同幺九順但無鳴牌，手牌點值立即 +60；不重複算門清。</li>
      </ul>
    </li>
    <li><b>6 番（封頂）</b>
      <ul>
        <li><b>幺九龍</b>：同花色 123＋456＋789＋紅中、發財、白板各一＋同花色數字或三元的眼，手牌點值立即 +90。</li>
        <li><b>門清幺九龍</b>：同上但無鳴牌，手牌點值立即 +120。</li>
        <li><b>槓三元</b>：紅中、發財、白板全槓，手牌點值立即 +90。</li>
        <li><b>天胡</b>：莊家起手即胡。</li>
        <li><b>地胡</b>：閒家胡莊家打出的第一隻牌。</li>
        <li><b>人胡</b>：閒家第一次摸牌自摸，之前無人吃碰槓。</li>
        <li>天胡、地胡、人胡只要牌型完成即可，即使該手牌原是 0 番也算胡。手牌點值立即 +30，固定 6 番。</li>
      </ul>
    </li>
  </ul>
  ${EGH('牌面示例：番種', 'zh', '換一組')}
  <h3>半番（碎番，每項 +0.5 番）</h3>
  <ul>
    <li>必須已有至少 1 番才能追加；只有碎番、沒有全番不能胡，兩個半番不能起胡。</li>
    <li><b>槓</b>：每次槓。</li>
    <li><b>三元大補槓</b></li>
    <li><b>門清</b>：無鳴牌。不求人、全小字、七對子、門清幺九順不再加。</li>
    <li><b>自摸</b>：自己摸到胡牌。不求人已包含自摸，不重複計。</li>
    <li><b>槓上自摸</b>：槓後補牌自摸。與自摸及槓重疊，合共追加 1.5 番。</li>
    <li><b>海底撈月</b>：摸到牌山最後一張牌並自摸胡。與自摸重疊（有鳴牌時合共追加 1 番）。</li>
    <li><b>斷一門無三元</b>：筒索萬缺一門且沒有紅中、發財、白板；清一色不重複算。</li>
    <li><b>胡大字</b>：胡的那張牌是 7–9。</li>
  </ul>
  <h3>暗刻</h3>
  <ul>
    <li>暗槓算暗刻。</li>
    <li>榮胡時，靠胡牌完成的刻子算明刻。</li>
    <li>但如果胡牌可以放進眼或順子，該刻子仍算暗刻（榮胡進眼不毀暗刻）。</li>
  </ul>
  <h3>計分</h3>
  <ul>
    <li>總番數取整數部分，所以 1+0.5＝1.5 番算 1 番，1+0.5+0.5＝2 番。</li>
    <li>倍數 = 番數（1 番 ×1 … 6 番 ×6）。</li>
    <li>得分 = 全手牌點值總和（含已鳴的牌，扣除彩碰被要的那張，加上各牌型的立即加分）× 倍數。</li>
    <li>付款（暫定）：自摸，其餘三家各付一份；出銃，出銃者付兩份。</li>
  </ul>
  <h3>操作</h3>
  <ul><li>點一下牌＝選取並顯示資訊；手機上再點一次是取消選取。要打出時，按手牌下面的「打出」按鈕，只會打出目前選取的那張。滑鼠用戶也可以對已選取的牌再點一次來打出。</li>
    <li>調整手牌順序：電腦用滑鼠拖曳；手機長按牌再拖曳。也可以先選一張牌，按 ◀ ▶ 移動；按「整理」回到自動排序。</li>
    <li>滑鼠移到牌上（手機點一下牌）會顯示這種牌共幾張、已見幾張、還剩幾張（已見＝你的手牌＋所有棄牌＋所有鳴牌）。</li></ul>`,
en: `  <h2>Kowloon Dragons (幺九龍): Rules</h2>
  <p class="rintro">Kowloon Dragons is a brand-new game from the mahjong family, and you're invited to try it! Its biggest difference from traditional mahjong is that every tile carries a point value and the number of copies varies, so every draw is a fresh opportunity. On top of the traditional scoring conditions, it adds brand-new ones: lots of variety, a light and quick pace, and a good fit for anyone, whether or not you've played traditional mahjong.</p>
  <p>Kowloon Dragons is a tile game from the mahjong family. It needs its own 150-tile set, not a regular mahjong set. You can play against 3 computer players, or open a room and play with friends online (up to 4 players, with bots filling empty seats). A hand starts with the dealer; there are no winds or dealer streaks. The wall is reshuffled every hand and scores carry over. The deal passes on every hand; 4 hands make a round (Red, Green or White Dragon round) and 3 rounds make a full set of 12 hands.</p>
  <h3>Goal</h3>
  <ul>
    <li>Hand of 13 tiles; you win on the 14th with <b>4 melds + 1 pair</b> (a meld is a sequence, a triplet or a kong).</li>
    <li>You need at least <b>1 full fan</b> to win. Minor fans (½) alone don't count.</li>
  </ul>
  <h3>Tiles and points</h3>
  <ul>
    <li>Circles (筒), Bamboo (索), Characters (萬): 45 tiles each, with <b>10 − n copies of number n</b> (nine 1s … one 9).</li>
    <li>Dragons: Red (中), Green (發) and White (白), 5 copies each. 150 tiles in total.</li>
    <li>Point value = the number on the tile: 1 = 1 pt … 9 = 9 pts. Dragons = 0. The higher the number, the rarer the tile.</li>
    <li>Small tiles = 1–3. Middle tiles = 4–6. Big tiles = 7–9.</li>
  </ul>
  <h3>Calling a discard</h3>
  <ul>
    <li><b>Chow (吃)</b>
      <ul>
        <li>Same suit only, and only from your upstream player (the one who plays right before you, on your left).</li>
        <li>A claimed sequence can't contain a 1–3. Holding 4-5 you can't Chow a 3; holding 2-3 you can't Chow a 4.</li>
        <li>So only <b>456, 567, 678 and 789</b> can be claimed. A 123 sequence is fine inside your closed hand.</li>
        <li>No mixed chow.</li>
      </ul>
    </li>
    <li><b>Pung (碰)</b>
      <ul>
        <li>Allowed for 4–9 and dragons. Small tiles (1–3) can never be punged.</li>
        <li>If several players can Pung the same discard, priority is: the discarder's downstream player (next to play), then across, then upstream.</li>
      </ul>
    </li>
    <li><b>Kong (槓)</b>
      <ul>
        <li>Allowed for 4–6 and dragons, same suit and number only. No mixed kong.</li>
        <li>Small tiles (1–3) and big tiles (7–9) can't be konged or concealed-konged.</li>
        <li>After a kong you draw a replacement tile from the end of the wall.</li>
      </ul>
    </li>
    <li><b>Win (胡)</b> beats Pung and Kong, and a Chow comes last. No robbing the Kong.</li>
  </ul>
  ${EG('Tile examples: Chow, Pung, Kong', [X('Chow','s2 s3 s4|p4 p5 p6|m1 m2 m3'),X('Pung / Kong','p5 p5 p5|s6 s6 s6 s6|z1 z1 z1'),X('Never claimable (1–3)','p7 p8 p9|s8 s8 s8|m9 m9 m9')])}
  <h3>Special actions</h3>
  <ul>
    <li><b>Mixed pung (彩碰)</b>
      <ul>
        <li>Numbers 7–9 only: the same number in three different suits.</li>
        <li>Example: hold 9筒 + 9索 and claim a 9萬, or hold two 8索 and claim an 8筒.</li>
        <li>The claimed tile scores 0 (shown faded); the tiles from your hand still score.</li>
      </ul>
    </li>
    <li><b>Mixed triplet in hand (彩刻)</b>
      <ul>
        <li>The same three-suit set of a 7–9 number can also be formed inside your closed hand, with no call.</li>
        <li>It counts as a concealed triplet for All Triplets, Three Concealed Triplets and Four Concealed Triplets.</li>
        <li>On a discard win, a mixed triplet completed by the winning tile counts as open, unless that tile could sit in the pair or a sequence.</li>
      </ul>
    </li>
    <li><b>Mixed pair (彩眼)</b>
      <ul>
        <li>Two tiles of the same number 7–9 in different suits can serve as the pair, for example 9筒 + 9索. It can never be called, only completed by winning (on a discard or by self-draw).</li>
        <li>It is not a dragon pair, and the Kowloon Dragons pair must still be two identical tiles.</li>
      </ul>
    </li>
    <li><b>Grand dragon Kong (三元大槓)</b>
      <ul>
        <li>After a concealed Kong or added Kong of a dragon, you can add the 5th copy (press Grand Kong).</li>
        <li>Worth an extra ½ fan. Each dragon has 5 copies; this must be self-drawn.</li>
      </ul>
    </li>
  </ul>
  ${EG('Tile examples: special actions', [X('Mixed Pung (claimed tile faded)','p1 s1 m1*|s2 s2 p2*|m3 p3* s3'),X('Mixed triplet in hand (concealed)','p1 s1 m1|p2 s2 m2|p3 s3 m3'),X('Mixed pair','p1 s1|p2 m2|s3 m3'),X('Grand dragon Kong (5 copies)','z1 z1 z1 z1 z1|z2 z2 z2 z2 z2|z3 z3 z3 z3 z3')])}
  <h3>Winning hands (fans stack, capped at 6)</h3>
  <ul>
    <li><b>1 fan</b>
      <ul>
        <li><b>Dragon triplet (三元刻)</b>: each triplet of Red, Green or White Dragon counts, whether it is a revealed Pung or a concealed triplet. They stack.</li>
        <li><b>All Sequences (平胡)</b>: all sequences, no dragons.</li>
        <li><b>All Triplets (對對胡)</b>: 4 triplets + pair. Mixed Pungs are allowed.</li>
        <li><b>Concealed Self-Draw (不求人)</b>: no calls and you win by drawing. Replaces Concealed and Self-draw.</li>
        <li><b>Three Concealed Triplets (三暗刻)</b>: three triplets you formed yourself in your hand (not Pung'd from someone else's discard; a concealed Kong counts). The fourth meld can be anything: open or concealed, a sequence or a triplet, even a Pung or Chow.</li>
      </ul>
    </li>
    <li><b>2 fan</b>
      <ul>
        <li><b>Half Flush (混一色)</b>: one suit plus dragons. No mixed Pung, mixed triplet or mixed pair The first dragon triplet isn't counted separately.</li>
        <li><b>Mixed Flush (彩一色)</b>: a Full Flush (no dragons) with exactly one mixed part: either the pair is a mixed pair, or one of the triplets is a mixed Pung / mixed triplet. That mixed pair, Pung or triplet must contain at least one tile of the main suit (e.g. 8-Circle 8-Circle 8-Character in a Circles hand). A mixed pair and a mixed Pung together, or more than one mixed Pung, don't count. A Half Flush with a mixed part doesn't count.</li>
        <li><b>No Small, No Dragons (斷小字無三元)</b>: no 1–3 and no dragon tiles anywhere in the hand.</li>
        <li><b>Seven Pairs (七對子)</b>: seven pairs, all concealed. Four of a kind counts as two pairs (2222). No mixed pair. Can stack with Half Flush and Full Flush. No Concealed bonus on top.</li>
      </ul>
    </li>
    <li><b>3 fan</b>
      <ul>
        <li><b>Small Dragons (小三元)</b>: two dragon triplets + a pair of the third. Replaces the dragon triplet fan; hand points +30.</li>
        <li><b>All Small (全小字)</b>: only 1–3 number tiles in the whole hand. No Concealed bonus.</li>
        <li><b>Kowloon Straight (幺九順)</b>: 123 + 456 + 789 in one suit. The remaining meld is a sequence or a triplet in any suit; the pair is anything. Hand points +30.</li>
      </ul>
    </li>
    <li><b>4 fan</b>
      <ul>
        <li><b>Full Flush (清一色)</b>: one suit only, no dragons. No mixed Pung, mixed triplet or mixed pair (otherwise it counts only as a Mixed Flush). Doesn't also get Missing suit, no dragons.</li>
        <li><b>Four Concealed Triplets (四暗刻)</b>: all four triplets are concealed (formed yourself in your hand; a concealed Kong counts). Doesn't also get All Triplets or Concealed Self-Draw; winning by self-draw adds only the Self-draw half fan (4 fan + ½). On Ron, the winning tile must go into the pair; if it completes a triplet, that one is open and the hand is only Three Concealed Triplets.</li>
        <li><b>Great Dragons (大三元)</b>: triplets of all three dragons. Replaces the dragon triplet fan; hand points +60.</li>
        <li><b>Concealed Kowloon Straight (門清幺九順)</b>: a Kowloon Straight with no open melds. Hand points +60. No Concealed bonus on top.</li>
      </ul>
    </li>
    <li><b>6 fan (cap)</b>
      <ul>
        <li><b>Kowloon Dragons (幺九龍)</b>: 123 + 456 + 789 in one suit + one each of Red, Green and White Dragon + a pair of a same-suit number or a dragon. Hand points +90.</li>
        <li><b>Concealed Kowloon Dragons (門清幺九龍)</b>: the same, with no open melds. Hand points +120.</li>
        <li><b>Dragon Kongs (槓三元)</b>: Kongs of all three dragons. Hand points +90.</li>
        <li><b>Blessing of Heaven (天胡)</b>: the dealer wins on the starting hand.</li>
        <li><b>Blessing of Earth (地胡)</b>: a non-dealer wins on the dealer's very first discard.</li>
        <li><b>Blessing of Man (人胡)</b>: a non-dealer wins by self-draw on their first draw, with nobody having called a Chow, Pung or Kong before it.</li>
        <li>The Blessings of Heaven, Earth and Man only need a complete hand, even if it is otherwise 0 fan. Hand points +30, fixed at 6 fan.</li>
      </ul>
    </li>
  </ul>
  ${EGH('Tile examples: winning hands', 'en', 'Shuffle')}
  <h3>Minor fans (碎番, ½ fan each)</h3>
  <ul>
    <li>Only added once you already have at least 1 full fan; two ½ fans alone can't win.</li>
    <li><b>Kong (槓)</b>: each kong.</li>
    <li><b>Grand dragon Kong (三元大補槓)</b></li>
    <li><b>Concealed (門清)</b>: no calls. Not given with Concealed Self-Draw, All Small, Seven Pairs or Concealed Kowloon Straight.</li>
    <li><b>Self-draw (自摸)</b>: you win on a tile you drew yourself. Concealed Self-Draw already includes it, so it isn't counted twice.</li>
    <li><b>Win on Last Tile (海底撈月)</b>: you win by self-draw on the very last tile of the wall. It stacks with Self-draw, so for a hand with calls it adds 1 fan in total.</li>
    <li><b>Win on Kong (槓上自摸)</b>: you win by self-draw on the replacement tile drawn after a Kong. It stacks with Self-draw and Kong, so a win like that adds 1½ fan in total.</li>
    <li><b>Missing suit, no dragons (斷一門無三元)</b>: one of the three suits is absent and the hand has no dragons. Full Flush doesn't get it.</li>
    <li><b>Win on a big tile (胡大字)</b>: the winning tile is a 7–9.</li>
  </ul>
  <h3>Concealed triplets</h3>
  <ul>
    <li>A concealed kong counts as concealed.</li>
    <li>On a discard win, a triplet completed by the winning tile counts as open.</li>
    <li>But if the winning tile could instead sit in the pair or in a sequence, the triplet stays concealed.</li>
  </ul>
  <h3>Minimum to win</h3>
  <ul><li>Usually <b>1 fan min</b>: you need at least 1 full fan to win. You can also play <b>2 fan min</b>: the total (half fans count, e.g. 1 + ½ + ½) must reach 2 fan. Choose it in Settings (vs bots) or when creating a room.</li></ul>
  <h3>Scoring</h3>
  <ul>
    <li>Total fan is rounded down, so 1 + ½ = 1.5 counts as 1 fan, while 1 + ½ + ½ = 2 fan.</li>
    <li>Multiplier = fan (1 fan ×1 … 6 fan ×6).</li>
    <li>Score = total tile points of the whole hand (melds included, minus the claimed tile of a mixed Pung, plus any instant bonus of the hand) × multiplier.</li>
    <li>Payment (provisional): on a self-draw each of the other three pays one share; on a discard win the discarder pays two shares.</li>
  </ul>
  <h3>Controls</h3>
  <ul>
    <li>Tap a tile to select it and see its info; on a phone, tap again to unselect. To discard, press the Discard button under your hand. It discards only the selected tile. With a mouse, clicking a selected tile again also discards it.</li>
    <li>Reorder your hand: drag with the mouse, or long-press and drag on a phone. You can also select a tile and use ◀ ▶. "Sort" goes back to auto-sort.</li>
    <li>Hover over a tile (tap it on a phone) to see how many copies exist, how many you can see and how many remain. Seen = your hand + all discards + all melds.</li>
    <li>The computer players are simple (no defense, random calls). They are there to test the rules.</li>
  </ul>`
};
RULES_HTML.ja = `  <h2>ルール</h2>
  <p class="rintro">幺九龍は麻雀系の新しいゲームです。ぜひ遊んでみてください！従来の麻雀との一番の違いは、すべての牌に点数があり、枚数もまちまちなところ。ツモるたびに新しいチャンスがあります。従来の役に加えて新しい役もあり、バリエーション豊かでテンポよく進むので、麻雀経験のある方もない方も楽しめます。</p>
  <p>CPU3人と対戦するほか、ルームを作って友だちと遊ぶこともできます（最大4人、空席はCPUが埋めます）。毎局、親から配牌が始まります。風や連荘はなく、毎局シャッフルし直し、点数は累計されます。親は毎局交代し、4局で1ラウンド（中場・發場・白場）、3ラウンドで1セット（12局）です。</p>
  <h3>牌と点数</h3>
  <ul>
    <li>筒子・索子・萬子は各45枚（数字nの牌が10−n枚：一は9枚 … 九は1枚）、白・發・中は各5枚、合計150枚。</li>
    <li>点数 ＝ 牌の数字（一＝1 … 九＝9）、三元牌は0点。数字が大きいほど枚数が少なくなります。</li>
    <li>小字牌＝1〜3、大字牌＝7〜9。</li>
  </ul>
  <h3>チー・ポン・カン</h3>
  <ul>
    <li>小字牌（1〜3）はチー・ポン・カンができず、暗槓も不可で、副露にも使えません。</li>
    <li>彩ポン：7〜9の同じ数字で色が異なる3枚（手牌の2枚を使って鳴くのも可）。鳴いた1枚は点数に数えず、薄く表示されます。</li>
    <li>彩刻子：7〜9の同じ数字で色が異なる3枚は、鳴かずに手牌の中で暗刻として作れます。普通の刻子と同じ扱い（対々和・三暗刻・四暗刻にも使えます）。3枚とも同じ色なら普通の刻子です。</li>
    <li>彩雀頭：7〜9の同じ数字で色が異なる2枚（例：九筒＋九索）は雀頭にできます。鳴くことはできず、ロン（またはツモ）でのみ完成します。三元牌の雀頭ではなく、幺九龍の雀頭は同じ牌2枚が必要です。</li>
    <li>彩チーはなし：チーは同じ色の順子のみ、上家からのみ。順子に1〜3を含められません（4・5で3をチー不可、2・3で4をチー不可）。鳴けるのは456・567・678・789だけです。</li>
    <li>カンできるのは4〜6と三元牌だけで、1〜3と7〜9は暗槓もできません。混合カンもなし。カンは同じ色・同じ数字のみ。</li>

function tutStop() { TUT.timers.forEach(clearTimeout); TUT.timers = []; TUT.raf.forEach(cancelAnimationFrame); TUT.raf = []; }
function tutFly(st, a, b) {
  const e = st.querySelector(a), t = st.querySelector(b); if (!e || !t) return;
  const er = e.getBoundingClientRect(), tr = t.getBoundingClientRect();
  e._tx = (e._tx || 0) + tr.left + tr.width / 2 - er.left - er.width / 2; e._ty = (e._ty || 0) + tr.top + tr.height / 2 - er.top - er.height / 2;
  e.style.transform = `translate(${e._tx}px,${e._ty}px)`;
}
function tutCount(e, ms, instant) {
  const to = +e.dataset.to; if (instant) { e.textContent = to; return; }
  const t0 = performance.now(), f = now => { const k = Math.min(1, (now - t0) / ms); e.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) TUT.raf.push(requestAnimationFrame(f)); };
  TUT.raf.push(requestAnimationFrame(f));
}
function tutPlay() {
  tutStop();
  const st = $('#ttStage'); if (!st) return;
  const S = tutSteps()[TUT.i], q = [], P = (t, f) => q.push([t, f]), all = sel => [...st.querySelectorAll(sel)];
  const rm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  (S.acts || []).forEach(([t, op, a, b, c]) => {
    if (op === 'say') P(t, () => { const x = st.querySelector('.tt-say'); x.textContent = a; x.classList.toggle('on', !!a); });
    else if (op === 'show+') all(a).forEach((e, i) => P(t + i * b, () => e.classList.remove('hid')));
    else if (op === 'add+') all(a).forEach((e, i) => P(t + i * c, () => e.classList.add(b)));
    else if (op === 'show') P(t, () => all(a).forEach(e => e.classList.remove('hid')));
    else if (op === 'add') P(t, () => all(a).forEach(e => e.classList.add(...b.split(' '))));
    else if (op === 'rm') P(t, () => all(a).forEach(e => e.classList.remove(...b.split(' '))));
    else if (op === 'fly') P(t, () => tutFly(st, a, b));
    else if (op === 'count') P(t, () => all(a).forEach(e => tutCount(e, b, rm)));
  });
  q.sort((x, y) => x[0] - y[0]);
  q.forEach(([t, f]) => { if (rm) f(); else TUT.timers.push(setTimeout(f, t)); });
}
